<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scanline Lab</title>
<style>
:root{
  --bg:#f3f1ec;--panel:#fff;--ink:#1b1d22;--mute:#6b7079;--line:#d9d6cd;--acc:#2b54d6;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--panel:#1d2026;--ink:#e9e7e1;--mute:#8d929c;--line:#31353d;--acc:#7da0ff}}
:root[data-theme="dark"]{--bg:#14161a;--panel:#1d2026;--ink:#e9e7e1;--mute:#8d929c;--line:#31353d;--acc:#7da0ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Avenir Next","Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:460px;margin:0 auto;padding:14px 16px 28px}
h1{font-size:20px;margin:4px 0 2px;font-weight:650}
.sub{color:var(--mute);font-size:13px;margin:0 0 12px}
.view{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:12px;overflow:hidden}
.view canvas{display:block;margin:0 auto;image-rendering:pixelated}
.read{font:12px ui-monospace,Menlo,monospace;color:var(--mute);margin:6px 2px 0}
.ctl{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px}
.row{display:grid;grid-template-columns:92px 1fr 64px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row label{font-size:13px}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=number]{width:64px;font:13px ui-monospace,Menlo,monospace;padding:4px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
input[type=color]{width:64px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:2px}
.btns{display:flex;gap:8px;margin:12px 0 0}
button{flex:1;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-weight:600}
button.go{background:var(--acc);color:#fff;border-color:var(--acc)}
#full{position:fixed;inset:0;z-index:9;background:#000;display:none}
#full canvas{display:block;image-rendering:pixelated}
#full.on{display:block}
</style>
</head>
<body>
<main id="ui">
  <h1>Scanline Lab</h1>
  <p class="sub">All sizes are in device pixels. The preview draws 1:1 with your screen, so nothing gets resampled.</p>
  <div class="view"><canvas id="pv"></canvas><div class="read" id="rd"></div></div>
  <div class="ctl" id="ctl"></div>
  <div class="btns">
    <button id="reset">Reset</button>
    <button class="go" id="fs">Full view</button>
  </div>
  <p class="sub" style="margin-top:10px">Full view fills your real viewport at native pixels. Screenshot it, tap to return.</p>
</main>
<div id="full"><canvas id="fc"></canvas></div>

<script>
const DEF={thickness:1,spacing:3,offset:0,opacity:.5,angle:0,gray:128,drift:0,color:"#000000"};
const SPEC=[
 ["thickness","Thickness",0.1,10,0.05],
 ["spacing","Spacing",1,20,0.05],
 ["offset","Offset",0,20,0.05],
 ["opacity","Opacity",0,1,0.01],
 ["angle","Angle °",0,180,0.5],
 ["gray","Base gray",0,255,1],
 ["drift","Drift px/s",0,60,0.5]
];
let P=Object.assign({},DEF), t0=performance.now(), full=false, dirty=true;
const $=id=>document.getElementById(id);
const ctl=$("ctl");

// build controls
SPEC.forEach(([k,label,min,max,step])=>{
  const r=document.createElement("div");r.className="row";
  r.innerHTML=`<label for="n_${k}">${label}</label><input type="range" id="r_${k}" min="${min}" max="${max}" step="${step}"><input type="number" id="n_${k}" min="${min}" max="${max}" step="${step}">`;
  ctl.appendChild(r);
  const rg=r.querySelector("[type=range]"),nm=r.querySelector("[type=number]");
  const set=v=>{v=parseFloat(v);if(isNaN(v))return;P[k]=v;rg.value=v;if(document.activeElement!==nm)nm.value=v;dirty=true};
  rg.oninput=()=>{nm.value=rg.value;set(rg.value)};
  nm.oninput=()=>set(nm.value);
  nm.onchange=()=>{nm.value=P[k]};
});
const cr=document.createElement("div");cr.className="row";
cr.innerHTML=`<label for="c">Line color</label><span></span><input type="color" id="c">`;
ctl.appendChild(cr);
$("c").oninput=e=>{P.color=e.target.value;dirty=true};

function syncUI(){
  SPEC.forEach(([k])=>{$("r_"+k).value=P[k];$("n_"+k).value=P[k]});
  $("c").value=P.color;
}

const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const cache=new WeakMap();

function draw(cv,cssW,cssH){
  const dpr=window.devicePixelRatio||1;
  const w=Math.max(1,Math.round(cssW*dpr)),h=Math.max(1,Math.round(cssH*dpr));
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;cache.delete(cv)}
  cv.style.width=cssW+"px";cv.style.height=cssH+"px";
  const ctx=cv.getContext("2d");
  let c=cache.get(cv);
  if(!c){const img=ctx.createImageData(w,h);c={img,u32:new Uint32Array(img.data.buffer)};cache.set(cv,c)}
  const u=c.u32,g=P.gray,lc=hex(P.color),op=P.opacity;
  const pack=(r,gg,b)=>((255<<24)|(b<<16)|(gg<<8)|r)>>>0;
  const baseP=pack(g,g,g);
  const lineP=pack(Math.round(g*(1-op)+lc[0]*op),Math.round(g*(1-op)+lc[1]*op),Math.round(g*(1-op)+lc[2]*op));
  const a=P.angle*Math.PI/180,ca=Math.cos(a),sa=Math.sin(a);
  const off=P.offset+(P.drift?((performance.now()-t0)/1000*P.drift):0);
  const s=P.spacing,th=P.thickness;
  let i=0;
  for(let y=0;y<h;y++){
    const ry=y*ca+off;
    for(let x=0;x<w;x++){
      let m=(ry+x*sa)%s;if(m<0)m+=s;
      u[i++]=m<th?lineP:baseP;
    }
  }
  ctx.putImageData(c.img,0,0);
  return [w,h,dpr];
}

function frame(){
  if(dirty||P.drift>0){
    if(full){draw($("fc"),innerWidth,innerHeight)}
    else{
      const cw=Math.min(innerWidth-48,380),[w,h,d]=draw($("pv"),cw,200);
      $("rd").textContent=`canvas ${w}×${h} device px · DPR ${d}`+(Number.isInteger(d)?"":" (non-integer: expect extra resampling)");
    }
    dirty=false;
  }
  requestAnimationFrame(frame);
}

$("fs").onclick=()=>{full=true;$("full").classList.add("on");dirty=true};
$("full").onclick=()=>{full=false;$("full").classList.remove("on");dirty=true};
$("reset").onclick=()=>{P=Object.assign({},DEF);syncUI();dirty=true};
addEventListener("resize",()=>{dirty=true});
syncUI();requestAnimationFrame(frame);
</script>
</body>
</html>
