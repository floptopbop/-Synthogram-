<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PHOTOGRAMMETRIC // GPU_SHADER_CORE_V6</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100dvh;overflow:hidden;background:#010103;color:#d6c8a8;font-family:'Share Tech Mono',monospace;overscroll-behavior:none}
#app{width:100%;height:100%;position:relative;overflow:hidden}
#glCanvas{display:block;position:absolute;inset:0;width:100%;height:100%;z-index:0;cursor:grab}
#glCanvas:active{cursor:grabbing}

/* start */
#start-screen{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#010103;gap:18px}
#start-screen p{font-size:11px;color:#2a3a2e;letter-spacing:0.2em;text-align:center;line-height:2.4}
#start-screen p span{color:#00cc88}
#start-btn{border:1.5px solid #00ffaa;background:transparent;color:#00ffaa;font-family:inherit;font-size:12px;letter-spacing:0.2em;padding:12px 32px;cursor:pointer;transition:0.1s linear}
#start-btn:active{background:#00ffaa;color:#010103}

/* fps */
#fps{position:absolute;top:12px;right:16px;font-size:10px;color:#005540;letter-spacing:0.1em;z-index:12;pointer-events:none;background:rgba(0,0,0,0.5);padding:2px 8px;border-radius:20px}

/* sheet */
#bottom-sheet{position:absolute;bottom:0;left:0;width:100%;z-index:25;transform:translateY(calc(100% - 48px - env(safe-area-inset-bottom,0px)));transition:transform 0.32s cubic-bezier(0.2,0.9,0.4,1.1)}
#bottom-sheet.open{transform:translateY(0)}
#pull-tab{width:80px;height:28px;margin:0 auto;background:#0a120e;border:1px solid #0d3326;border-bottom:none;border-radius:12px 12px 0 0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold;color:#1a5240;letter-spacing:0.2em;cursor:pointer;transition:0.1s}
#pull-tab:active{background:#0d2a1e;color:#00ffaa}

#controls{background:rgba(2,8,5,0.97);backdrop-filter:blur(10px);border-top:1px solid #0d3326;padding:18px 20px 12px;display:grid;grid-template-columns:1fr 1fr;gap:16px 24px;max-height:40vh;overflow-y:auto;overscroll-behavior:contain}
#controls::-webkit-scrollbar{width:3px}
#controls::-webkit-scrollbar-thumb{background:#0d3326;border-radius:2px}

.sl{grid-column:1/-1;font-size:9px;color:#1a5240;letter-spacing:0.15em;padding-top:6px;border-top:1px solid #0a1e16;margin-bottom:-4px}
.sl:first-child{border-top:none;padding-top:0}
.param{display:flex;flex-direction:column;gap:5px}
.param.full{grid-column:1/-1}
.ph{display:flex;justify-content:space-between;align-items:baseline}
.pl{font-size:9px;color:#00cc88;letter-spacing:0.12em;text-transform:uppercase}
.pv{font-size:11px;color:#00ffaa;font-weight:bold}

input[type=range]{-webkit-appearance:none;width:100%;height:2px;background:#0a2018;border-radius:2px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#00ffaa;border:none;cursor:pointer;box-shadow:0 0 6px rgba(0,255,170,0.4)}
input[type=range]:active::-webkit-slider-thumb{background:#80ffcc;transform:scale(1.2)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#00ffaa;border:none;cursor:pointer}

.trow{display:flex;gap:4px;grid-column:1/-1}
.tbtn{flex:1;padding:7px 0;background:#0a120e;color:#1a5240;border:1px solid #0d3326;font-family:inherit;font-size:9px;letter-spacing:0.1em;cursor:pointer;transition:0.08s;text-transform:uppercase}
.tbtn.on{background:#0d2a1e;color:#00ffaa;border-color:#00ffaa}
.tbtn:active{background:#0d2a1e}

#btn-row{display:flex;background:rgba(2,8,5,0.97);backdrop-filter:blur(10px);border-top:1px solid #0a1e16;padding-bottom:env(safe-area-inset-bottom,0px)}
.btn{flex:1;border:none;border-right:1px solid #0a1e16;background:transparent;color:#1a5240;padding:16px 0;font-size:10px;font-family:inherit;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;transition:0.05s}
.btn:last-child{border-right:none}
.btn:active,.btn.on{background:#0a1e16;color:#00ffaa}
.btn.on{border-bottom:2px solid #00ffaa}

#video-hidden{display:none}
  </style>

<body>
<div id="app">
  <canvas id="glCanvas"></canvas>

  <div id="start-screen">

    SOBEL · QU8BIT · TEMPORAL<br>

    <button id="start-btn">▶ INIT OPTICAL PIPELINE</button>
  </div>

  <span id="fps">– fps</span>

  <div id="bottom-sheet">
    <div id="pull-tab">▴ UI</div>
    <div id="controls">

      <div class="sl">◄ DEPTH FIELD ►</div>

      <div class="sl">◄ TEMPORAL ►</div>

        <input type="range" id="s-decay" min="0.5" max="0.99" step="0.005" value="0.92">
      </div>
      <div class="param">
        <div class="ph"><span class="pl">TRAIL MIX</span><span class="pv" id="v-tmix">0.55</span></div>
        <input type="range" id="s-tmix" min="0" max="1" step="0.02" value="0.55">
      </div>

      <div class="sl">◄ LAYER FLAGS ►</div>
      <div class="trow">
        <button class="tbtn on" id="t-sobel"    onclick="tog('sobel')">SOBEL</button>
        <button class="tbtn on" id="t-qu8bit"   onclick="tog('qu8bit')">QU8BIT</button>
        <button class="tbtn on" id="t-temporal" onclick="tog('temporal')">ACCUM</button>
      </div>

      <div class="sl">◄ COLOR MODE ►</div>
      <div class="trow">
        <button class="tbtn on" id="c-0" onclick="setCol(0)">TRUE</button>
        <button class="tbtn"    id="c-1" onclick="setCol(1)">THERMAL</button>
        <button class="tbtn"    id="c-2" onclick="setCol(2)">CHROMA</button>
        <button class="tbtn"    id="c-3" onclick="setCol(3)">EDGE°</button>
      </div>

      <div class="sl">◄ CAMERA ►</div>
      <div class="trow">
        <button class="tbtn" onclick="flipCam()">FLIP CAM</button>
        <button class="tbtn" onclick="resetView()">RESET VIEW</button>
      </div>

    </div>
    <div id="btn-row">
      <button class="btn" id="btn-freeze" onclick="toggleFreeze()">FREEZE</button>
      <button class="btn" id="btn-clr"    onclick="clearAccum()">CLR TRAIL</button>
      <button class="btn"                  onclick="saveFrame()">SAVE</button>
    </div>
  </div>
</div>
<video id="video-hidden" autoplay playsinline muted></video>

<script>
// ═══════════════════════════════════════════════════════════════════
//  VERTEX SHADER
//  · Samples video texture at grid UV
//  · QU8BIT: staircase-quantize luma to N bands (Qu8bit.py logic)
//  · snap uniform blends raw vs quantized depth (0=smooth, 1=stepped)
//  · Passes UV to fragment shader for Sobel neighborhood sampling
// ═══════════════════════════════════════════════════════════════════
const VS = `#version 300 es
precision highp float;
in vec2 a_pos;

uniform sampler2D u_video;
uniform mat4  u_mvp;
uniform float u_depth;
uniform float u_ptsize;
uniform float u_bands;
uniform float u_snap;
uniform int   u_qu8bit;
out vec3  v_col;
out float v_luma;
out vec2  v_uv;

float lum(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }

float quantize(float v, float b){
  float step = 1.0 / (b - 1.0);
  return round(v / step) * step;
}

void main(){
  vec2 uv = vec2(a_pos.x * 0.5 + 0.5,
                 1.0 - (a_pos.y * 0.5 + 0.5));
  vec3 col = texture(u_video, uv).rgb;
  float raw = lum(col);

  float z = raw;
  if(u_qu8bit == 1){
    float q = quantize(raw, u_bands);
    z = mix(raw, q, u_snap);   // snap=0 smooth, snap=1 fully stepped
  }

  gl_Position  = u_mvp * vec4(a_pos * 30.0, (z - 0.5) * u_depth, 1.0);
  gl_PointSize = u_ptsize * (500.0 / max(0.1, gl_Position.w));

  v_col  = col;
  v_luma = z;
  v_uv   = uv;
}`;

// ═══════════════════════════════════════════════════════════════════
//  FRAGMENT SHADER
//  · Circular point mask
//  · Sobel 3×3 on video texture — full Gx/Gy matching Ultcolirascii kernel
//    - edge mag > threshold → colorize / boost
//    - EDGE° mode: angle → hue (direction-coded like the glyph system)
//  · Temporal: samples accumulation texture (2D canvas ping-pong),
//    blends prev*decay with current → trails moving geometry,
//    static structure solidifies
//  · Color modes: TRUE / THERMAL / CHROMA / EDGE°
// ═══════════════════════════════════════════════════════════════════
const FS = `#version 300 es
precision highp float;

in vec3  v_col;
in float v_luma;
in vec2  v_uv;

uniform sampler2D u_video;
uniform sampler2D u_accum;   // temporal accumulation canvas
uniform vec2  u_texel;       // 1/videoW, 1/videoH
uniform vec2  u_res;         // canvas resolution
uniform float u_eth;         // sobel threshold
uniform float u_ebo;         // sobel boost
uniform float u_decay;       // temporal decay
uniform float u_tmix;        // trail blend weight
uniform int   u_colorMode;
uniform int   u_sobel;
uniform int   u_temporal;

out vec4 fragColor;

// ── circular mask ──
float circ(){
  vec2 d = gl_PointCoord - 0.5;
  float r2 = dot(d, d);
  if(r2 > 0.25) discard;
  return 1.0 - smoothstep(0.18, 0.25, r2);
}

// ── HSV ──
vec3 hsv(float h, float s, float v){
  vec3 c = clamp(abs(mod(h * 6.0 + vec3(0,4,2), 6.0) - 3.0) - 1.0, 0.0, 1.0);
  return v * mix(vec3(1.0), c, s);
}

// ── Sobel 3×3: exact Ultcolirascii Gx/Gy kernel ──
void sobelGrad(vec2 uv, out float mag, out float angle){
  float k = dot(vec3(0.299,0.587,0.114), texture(u_video, uv + u_texel*vec2(-1,-1)).rgb); float tl=k;
        k = dot(vec3(0.299,0.587,0.114), texture(u_video, uv + u_texel*vec2( 0,-1)).rgb); float tc=k;
        k = dot(vec3(0.299,0.587,0.114), texture(u_video, uv + u_texel*vec2( 1,-1)).rgb); float tr=k;
        k = dot(vec3(0.299,0.587,0.114), texture(u_video, uv + u_texel*vec2(-1, 0)).rgb); float ml=k;
        k = dot(vec3(0.299,0.587,0.114), texture(u_video, uv + u_texel*vec2( 1, 0)).rgb); float mr=k;
        k = dot(vec3(0.299,0.587,0.114), texture(u_video, uv + u_texel*vec2(-1, 1)).rgb); float bl=k;
        k = dot(vec3(0.299,0.587,0.114), texture(u_video, uv + u_texel*vec2( 0, 1)).rgb); float bc=k;
        k = dot(vec3(0.299,0.587,0.114), texture(u_video, uv + u_texel*vec2( 1, 1)).rgb); float br=k;
  float gx = (tr + 2.0*mr + br) - (tl + 2.0*ml + bl);
  float gy = (bl + 2.0*bc + br) - (tl + 2.0*tc + tr);
  mag   = length(vec2(gx, gy)) * u_ebo;
  angle = atan(gy, gx);  // -PI to PI
}

void main(){
  float alpha = circ();

  // ── base color ──
  vec3 col;
  if(u_colorMode == 1){
    col = hsv((1.0 - v_luma) * 0.75, 1.0, 1.0);
  } else if(u_colorMode == 2){
    col = mix(vec3(0.0, 1.0, 0.67), vec3(1.0, 0.0, 0.5), v_luma);
  } else {
    col = v_col;
  }

  // ── Sobel overlay ──
  if(u_sobel == 1){
    float mag; float angle;
    sobelGrad(v_uv, mag, angle);

    if(u_colorMode == 3){
      // EDGE° mode: angle → hue, non-edges go near-black
      if(mag > u_eth){
        float hue = (angle / (2.0 * 3.14159265)) + 0.5;
        col = hsv(hue, 1.0, clamp(mag, 0.0, 1.0));
      } else {
        col = v_col * 0.06;
      }
    } else {
      // Other modes: edge points get a hot accent push
      if(mag > u_eth){
        float t = clamp((mag - u_eth) * 2.5, 0.0, 1.0);
        col = mix(col, vec3(0.0, 1.0, 0.67), t);
      }
    }
  } else if(u_colorMode == 3){
    // EDGE° with sobel off — just thermal fallback
    col = hsv((1.0 - v_luma) * 0.75, 1.0, 1.0);
  }

  // ── temporal accumulation ──
  // Reads the accumulation canvas texture (set in JS ping-pong).
  // prev * decay blended with current at u_tmix weight.
  // Moving things leave glowing trails; static geometry hardens.
  if(u_temporal == 1){
    vec2 suv = gl_FragCoord.xy / u_res;
    vec3 prev = texture(u_accum, suv).rgb;
    col = mix(col, prev * u_decay, u_tmix);
  }

  fragColor = vec4(col, alpha * 0.93);
}`;

// ═══════════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════════
const GRID = 256;
let gl, prog, vao, videoTex, accumTex;

// uniforms
let uMvp, uVideo, uAccum, uTexel, uRes;
let uDepth, uPtsize, uBands, uSnap;
let uEth, uEbo, uDecay, uTmix;
let uColorMode, uSobel, uQu8bit, uTemporal;

// params
let depthGain=20, ptSize=3, bands=7, snap=1.0;
let eth=0.15, ebo=3.0, decay=0.92, tmix=0.55;
let colorMode=0;
let flags={sobel:true, qu8bit:true, temporal:true};

// view
let rotX=0.35, rotY=-0.4, zoom=60;
let isDragging=false, lastX=0, lastY=0, pinchDist=null;

// misc
let frames=0, lastFpsTime=0;
let frozen=false;
let facingMode='environment', activeStream=null;
let noiseActive=false, noiseCv, noiseCtx;

// temporal: 2D canvas ping-pong — dead simple, no FBO
// We draw the GL canvas into a 2D canvas each frame, upload as texture
let accumCv, accumCtx;

const video  = document.getElementById('video-hidden');
const canvas = document.getElementById('glCanvas');
const fpsEl  = document.getElementById('fps');

// ═══════════════════════════════════════════════════════════════════
//  MATRIX (column-major WebGL)
// ═══════════════════════════════════════════════════════════════════
function persp(fov,asp,n,f){
  const t=1/Math.tan(fov*.5), nf=1/(n-f);
  return new Float32Array([t/asp,0,0,0, 0,t,0,0, 0,0,(f+n)*nf,-1, 0,0,2*f*n*nf,0]);
}
function mul(a,b){
  const o=new Float32Array(16);
  for(let c=0;c<4;c++) for(let r=0;r<4;r++)
    o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];
  return o;
}
function mkMV(rx,ry,tz){
  const cx=Math.cos(rx),sx=Math.sin(rx),cy=Math.cos(ry),sy=Math.sin(ry);
  return new Float32Array([cy,sx*sy,-cx*sy,0, 0,cx,sx,0, sy,-sx*cy,cx*cy,0, 0,0,tz,1]);
}
// ═══════════════════════════════════════════════════════════════════
//  SHADER UTILS
// ═══════════════════════════════════════════════════════════════════
function mkShader(type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))
    console.error('Shader error:',gl.getShaderInfoLog(s));
  return s;
}
function mkProg(vs,fs){
  const p=gl.createProgram();
  gl.attachShader(p,mkShader(gl.VERTEX_SHADER,vs));
  gl.attachShader(p,mkShader(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))
    console.error('Link error:',gl.getProgramInfoLog(p));
  return p;
}

// ═══════════════════════════════════════════════════════════════════
//  NOISE FALLBACK
// ═══════════════════════════════════════════════════════════════════
function initNoise(){
  noiseCv=document.createElement('canvas');
  noiseCv.width=noiseCv.height=64;
  noiseCtx=noiseCv.getContext('2d');
  noiseActive=true;
}
function pushNoise(t){
  const id=noiseCtx.createImageData(64,64),d=id.data;
  for(let i=0;i<d.length;i+=4){
    const idx=i>>2,x=idx%64,y=idx>>6;
    const v=(Math.sin(x*.25+t*.9)*Math.cos(y*.25+t*.7)+1)*127.5;
    d[i]=d[i+1]=d[i+2]=v; d[i+3]=255;
  }
  noiseCtx.putImageData(id,0,0);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D,videoTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,noiseCv);
}

// ═══════════════════════════════════════════════════════════════════
//  ACCUM TEXTURE HELPERS
// ═══════════════════════════════════════════════════════════════════
function initAccum(){
  // 2D canvas that mirrors the GL canvas size
  accumCv=document.createElement('canvas');
  accumCv.width=canvas.width; accumCv.height=canvas.height;
  accumCtx=accumCv.getContext('2d');

  // accumTex — upload blank first
  accumTex=gl.createTexture();
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D,accumTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,canvas.width,canvas.height,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
}

function captureAccum(){
  // Copy current GL canvas → 2D canvas → upload to accumTex
  // This is the "previous frame" for next iteration
  accumCtx.drawImage(canvas, 0, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D,accumTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,accumCv);
}

function clearAccum(){
  if(!accumCtx) return;
  accumCtx.clearRect(0,0,accumCv.width,accumCv.height);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D,accumTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,accumCv.width,accumCv.height,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
}

// ═══════════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════════
async function init(){
  canvas.width=window.innerWidth; canvas.height=window.innerHeight;
  gl=canvas.getContext('webgl2',{antialias:true,alpha:false,powerPreference:'high-performance'});
  if(!gl){alert('WebGL2 required');return;}

  prog=mkProg(VS,FS);

  // cache uniforms
  uMvp      =gl.getUniformLocation(prog,'u_mvp');
  uVideo    =gl.getUniformLocation(prog,'u_video');
  uAccum    =gl.getUniformLocation(prog,'u_accum');
  uTexel    =gl.getUniformLocation(prog,'u_texel');
  uRes      =gl.getUniformLocation(prog,'u_res');
  uDepth    =gl.getUniformLocation(prog,'u_depth');
  uPtsize   =gl.getUniformLocation(prog,'u_ptsize');
  uBands    =gl.getUniformLocation(prog,'u_bands');
  uSnap     =gl.getUniformLocation(prog,'u_snap');
  uEth      =gl.getUniformLocation(prog,'u_eth');
  uEbo      =gl.getUniformLocation(prog,'u_ebo');
  uDecay    =gl.getUniformLocation(prog,'u_decay');
  uTmix     =gl.getUniformLocation(prog,'u_tmix');
  uColorMode=gl.getUniformLocation(prog,'u_colorMode');
  uSobel    =gl.getUniformLocation(prog,'u_sobel');
  uQu8bit   =gl.getUniformLocation(prog,'u_qu8bit');
  uTemporal =gl.getUniformLocation(prog,'u_temporal');

  // grid
  const grid=new Float32Array(GRID*GRID*2);
  let idx=0;
  for(let y=0;y<GRID;y++) for(let x=0;x<GRID;x++){
    grid[idx++]=(x/(GRID-1))*2-1;
    grid[idx++]=(y/(GRID-1))*2-1;
  }
  vao=gl.createVertexArray(); gl.bindVertexArray(vao);
  const vbo=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,vbo);
  gl.bufferData(gl.ARRAY_BUFFER,grid,gl.STATIC_DRAW);
  const aPos=gl.getAttribLocation(prog,'a_pos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0);
  gl.bindVertexArray(null);

  // video texture → unit 0
  videoTex=gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D,videoTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,255]));
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);

  // accumulation canvas + texture → unit 1
  initAccum();

  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  gl.viewport(0,0,canvas.width,canvas.height);

  // resize
  window.addEventListener('resize',()=>{
    canvas.width=window.innerWidth; canvas.height=window.innerHeight;
    gl.viewport(0,0,canvas.width,canvas.height);
    // resize accum canvas too
    accumCv.width=canvas.width; accumCv.height=canvas.height;
  });

  // drag / rotate
  canvas.addEventListener('mousedown',e=>{isDragging=true;lastX=e.clientX;lastY=e.clientY});
  canvas.addEventListener('touchstart',e=>{
    if(e.touches.length===1){isDragging=true;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY}
  },{passive:true});
  window.addEventListener('mousemove',e=>{
    if(!isDragging)return;
    rotY+=(e.clientX-lastX)*.006; rotX+=(e.clientY-lastY)*.006;
    lastX=e.clientX; lastY=e.clientY;
  });
  window.addEventListener('touchmove',e=>{
    if(e.touches.length===2){
      const dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
                            e.touches[0].clientY-e.touches[1].clientY);
      if(pinchDist!==null) zoom=Math.max(15,Math.min(140,zoom-(dist-pinchDist)*.2));
      pinchDist=dist; return;
    }
    if(!isDragging)return;
    rotY+=(e.touches[0].clientX-lastX)*.006; rotX+=(e.touches[0].clientY-lastY)*.006;
    lastX=e.touches[0].clientX; lastY=e.touches[0].clientY;
  },{passive:true});
  window.addEventListener('mouseup',()=>isDragging=false);
  window.addEventListener('touchend',e=>{isDragging=false;if(e.touches.length<2)pinchDist=null});
  window.addEventListener('wheel',e=>{zoom=Math.max(15,Math.min(140,zoom+e.deltaY*.06));},{passive:true});

  // sliders
  const sl=(id,vi,set,dp)=>{
    document.getElementById(id).addEventListener('input',e=>{
      const v=parseFloat(e.target.value); set(v);
      document.getElementById(vi).textContent=dp!=null?v.toFixed(dp):v;
    });
  };
  sl('s-depth','v-depth',v=>depthGain=v,  1);
  sl('s-size', 'v-size', v=>ptSize=v,     1);
  sl('s-bands','v-bands',v=>bands=v,       0);
  sl('s-snap', 'v-snap', v=>snap=v,        2);
  sl('s-eth',  'v-eth',  v=>eth=v,         2);
  sl('s-ebo',  'v-ebo',  v=>ebo=v,         1);
  sl('s-decay','v-decay',v=>decay=v,       2);
  sl('s-tmix', 'v-tmix', v=>tmix=v,        2);

  document.getElementById('pull-tab').addEventListener('click',()=>
    document.getElementById('bottom-sheet').classList.toggle('open'));

  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════════════════════════════
async function startCam(){
  if(activeStream) activeStream.getTracks().forEach(t=>t.stop());
  try{
    activeStream=await navigator.mediaDevices.getUserMedia(
      {video:{facingMode,width:{ideal:640},height:{ideal:480}},audio:false});
    video.srcObject=activeStream; await video.play();
  }catch(e){console.warn('No cam, noise mode'); initNoise();}
}
function flipCam(){facingMode=facingMode==='environment'?'user':'environment';startCam();}

// ═══════════════════════════════════════════════════════════════════
//  UI CONTROLS
// ═══════════════════════════════════════════════════════════════════
function tog(k){
  flags[k]=!flags[k];
  document.getElementById('t-'+k).classList.toggle('on',flags[k]);
}
function setCol(m){
  colorMode=m;
  [0,1,2,3].forEach(i=>document.getElementById('c-'+i).classList.toggle('on',i===m));
}
function toggleFreeze(){
  frozen=!frozen;
  const b=document.getElementById('btn-freeze');
  b.textContent=frozen?'UNFREEZE':'FREEZE';
  b.classList.toggle('on',frozen);
}
function resetView(){rotX=0.35;rotY=-0.4;zoom=60;}
function saveFrame(){
  canvas.toBlob(b=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b);
    a.download='photogram_'+Date.now()+'.png';
    a.click();
  });
}

// ═══════════════════════════════════════════════════════════════════
//  RENDER LOOP
// ═══════════════════════════════════════════════════════════════════
function loop(ts){
  requestAnimationFrame(loop);

  frames++;
  if(ts-lastFpsTime>=1000){
    fpsEl.textContent=Math.round(frames*1000/(ts-lastFpsTime))+' fps';
    frames=0; lastFpsTime=ts;
  }

  // upload video frame → TEXTURE0
  if(noiseActive){
    pushNoise(ts*.001);
  } else if(!frozen && video.readyState>=video.HAVE_ENOUGH_DATA){
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D,videoTex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);
  }

  // clear
  gl.clearColor(0.003,0.003,0.010,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);

  // draw
  gl.useProgram(prog);
  gl.bindVertexArray(vao);

  // bind textures
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,videoTex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,accumTex);

  // matrix
  const P  =persp(55*Math.PI/180,canvas.width/canvas.height,.1,2000);
  const MV =mkMV(rotX,rotY,-zoom);
  const MVP=mul(P,MV);

  gl.uniformMatrix4fv(uMvp,false,MVP);
  gl.uniform1i(uVideo,    0);
  gl.uniform1i(uAccum,    1);
  gl.uniform2f(uTexel,    1/640, 1/480);
  gl.uniform2f(uRes,      canvas.width, canvas.height);
  gl.uniform1f(uDepth,    depthGain);
  gl.uniform1f(uPtsize,   ptSize);
  gl.uniform1f(uBands,    bands);
  gl.uniform1f(uSnap,     snap);
  gl.uniform1f(uEth,      eth);
  gl.uniform1f(uEbo,      ebo);
  gl.uniform1f(uDecay,    decay);
  gl.uniform1f(uTmix,     tmix);
  gl.uniform1i(uColorMode,colorMode);
  gl.uniform1i(uSobel,    flags.sobel    ?1:0);
  gl.uniform1i(uQu8bit,   flags.qu8bit   ?1:0);
  gl.uniform1i(uTemporal, flags.temporal ?1:0);

  gl.drawArrays(gl.POINTS,0,GRID*GRID);
  gl.bindVertexArray(null);

  // temporal: snapshot this frame → accumTex for next frame
  if(flags.temporal) captureAccum();
}

// ═══════════════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════════════
document.getElementById('start-btn').addEventListener('click',async()=>{
  document.getElementById('start-screen').style.display='none';
  await init();
  await startCam();
});
</script>
