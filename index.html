<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>QUADTREE // SONIC</title>
<style>
:root{--bg:#0a0a0b;--pn:#121214;--p2:#1a1a1d;--bd:#27272b;--tx:#a4a4a9;--br:#e6e6e8;--ac:#c4a46a;--dm:#6a6a70}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font:11px/1.35 -apple-system,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%;overflow:hidden;touch-action:manipulation}
#app{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#hdr{flex:0 0 34px;height:34px;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--pn);border-bottom:1px solid var(--bd)}
#hdr h1{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--br);white-space:nowrap}
.bd{color:var(--dm);font-size:9px;font-family:ui-monospace,Menlo,monospace}
.sp{flex:1}
.b{display:inline-flex;align-items:center;justify-content:center;height:24px;padding:0 10px;border:1px solid var(--bd);border-radius:4px;background:var(--p2);color:var(--br);font-size:11px;cursor:pointer;white-space:nowrap}
.b.pri{border-color:var(--ac);color:var(--ac)}
.b input{display:none}
#chs{flex:0 0 30px;height:30px;display:flex;align-items:center;gap:5px;padding:0 8px;overflow-x:auto;background:var(--pn);border-bottom:1px solid var(--bd)}
.ch{flex:0 0 auto;display:flex;align-items:center;gap:5px;height:22px;padding:0 3px 0 8px;border:1px solid var(--bd);border-left:3px solid var(--c,#555);border-radius:4px;background:var(--bg);cursor:pointer;white-space:nowrap}
.ch.on{background:var(--p2);border-color:var(--ac);border-left-color:var(--c,var(--ac));color:var(--br)}
.ch small{color:var(--dm);font-size:9px}
.mt{width:18px;height:18px;display:flex;align-items:center;justify-content:center}
.mt::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.mt.off::after{background:transparent;border:1px solid var(--dm)}
#stage{flex:1 1 auto;min-height:0;position:relative;background:#060607;overflow:hidden}
#stage canvas{position:absolute;top:0;left:0}
#hud{flex:0 0 22px;height:22px;line-height:22px;padding:0 8px;background:var(--pn);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);font:10px/22px ui-monospace,Menlo,monospace;color:var(--ac);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#deck{flex:0 0 auto;display:flex;flex-direction:column;background:var(--pn)}
#tabs{flex:0 0 28px;height:28px;display:flex;border-bottom:1px solid var(--bd)}
.tb{flex:1;text-align:center;line-height:26px;border-top:2px solid transparent;color:var(--dm);font-size:11px;cursor:pointer}
.tb.on{color:var(--ac);border-top-color:var(--ac)}
.tb.fold{flex:0 0 34px;color:var(--tx)}
#pane{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 10px 8px}
details{border-bottom:1px solid var(--bd);margin-bottom:3px}
summary{list-style:none;padding:5px 0;color:var(--ac);font-size:10px;letter-spacing:.05em;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::before{content:"\25B8  "}
details[open]>summary::before{content:"\25BE  "}
.g{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;padding:1px 0 7px}
.c .l{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:10px;color:var(--dm);height:16px}
.c .l i{font-style:normal;color:var(--br);font-family:ui-monospace,Menlo,monospace}
.c .l select{width:60%;height:18px;font-size:10px}
select{width:100%;height:20px;background:var(--p2);color:var(--br);border:1px solid var(--bd);border-radius:4px;font-size:11px;-webkit-appearance:none;appearance:none;padding:0 5px}
input[type=range]{display:block;width:100%;height:20px;background:transparent;-webkit-appearance:none;appearance:none}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--bd);border-radius:1px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-5.5px;border-radius:50%;background:var(--ac);border:0}
.row{display:flex;flex-wrap:wrap;gap:5px;padding:3px 0 6px}
.vs{display:flex;gap:4px;padding:2px 0 6px}
.vs .b{flex:1;padding:0 4px;border-left:3px solid var(--c)}
.vs .b.on{border-color:var(--ac);border-left-color:var(--c);color:var(--ac)}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;padding:2px 0 7px}
.bar{display:flex;align-items:center;gap:5px}
.bar span{width:46px;font-size:10px;color:var(--dm)}
.bar .t{flex:1;height:4px;background:var(--bd);border-radius:2px;overflow:hidden}
.bar .f{height:100%;background:var(--ac)}
.bar .f.w{background:#c27d5c}.bar .f.k{background:#6f93b8}
.bar b{width:28px;text-align:right;font-weight:normal;font:10px ui-monospace,Menlo,monospace;color:var(--br)}
.sw{display:flex;gap:4px;padding:2px 0 6px}
.sw div{flex:1;text-align:center;font:9px ui-monospace,Menlo,monospace}
.sw i{display:block;height:14px;border-radius:2px;border:1px solid rgba(255,255,255,.14);margin-bottom:2px}
.ln{padding:3px 0;border-bottom:1px dashed var(--bd);font-size:10px;color:var(--tx)}
.ln b{color:var(--br);font-weight:normal}
textarea{width:100%;height:70px;background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:4px;padding:5px;font:10px ui-monospace,Menlo,monospace;resize:none;-webkit-user-select:text;user-select:text;margin-bottom:5px}
#imgov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:9;color:var(--br)}
#imgov img{max-width:92%;max-height:80%;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <h1>QUADTREE // SONIC</h1><span class="bd">BUILD·04</span><div class="sp"></div>
    <label class="b">Image<input type="file" id="file" accept="image/*"></label>
    <button class="b pri" id="play">▶ Play</button>
  </div>
  <div id="chs"></div>
  <div id="stage"><canvas id="cv"></canvas><canvas id="ov"></canvas></div>
  <div id="hud">No image</div>
  <div id="deck"><div id="tabs"></div><div id="pane"></div></div>
</div>
<div id="imgov"><img id="imgsrc" alt=""><div>Long-press the image to save · tap anywhere to close</div></div>
<input type="file" id="sf" style="display:none">
<script>
'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const NOTE=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const SCALES=[['Locrian',[0,1,3,5,6,8,10]],['Phrygian',[0,1,3,5,7,8,10]],['Aeolian',[0,2,3,5,7,8,10]],['Dorian',[0,2,3,5,7,9,10]],['Mixolydian',[0,2,4,5,7,9,10]],['Ionian',[0,2,4,5,7,9,11]],['Lydian',[0,2,4,6,7,9,11]],['Pentatonic maj',[0,2,4,7,9]],['Pentatonic min',[0,3,5,7,10]],['Whole tone',[0,2,4,6,8,10]],['Harmonic min',[0,2,3,5,7,8,11]],['Hirajoshi',[0,2,3,7,8]],['In (Japanese)',[0,1,5,7,8]]];
const CH=['hue','saturation','luminance','contrast','edge','energy'];
const CHN={hue:'Hue',saturation:'Sat',luminance:'Lum',contrast:'Contrast',edge:'Edge',energy:'Energy'};
const VOICES=[
 {id:'lead',name:'Lead',ch:'hue',color:'#c98a78',type:'mel',mch:0,prog:81,bh:12},
 {id:'pad',name:'Pad',ch:'saturation',color:'#7ea3c4',type:'mel',mch:1,prog:89,bh:205},
 {id:'bass',name:'Bass',ch:'luminance',color:'#c4a46a',type:'mel',mch:2,prog:38,bh:38},
 {id:'pluck',name:'Pluck',ch:'contrast',color:'#a08dc4',type:'mel',mch:3,prog:107,bh:268},
 {id:'perc',name:'Perc',ch:'edge',color:'#8fb5a8',type:'perc',mch:9,prog:0,bh:158}];
VOICES.forEach((v,i)=>v.i=i);
const SRC_OPTS=[['none','—'],['val','Value'],['spr','Spread'],['imp','Importance'],['size','Depth'],['x','X'],['y','Y (top high)'],['rel','vs parent'],['lum','Brightness'],['h@','Hue here'],['s@','Sat here'],['l@','Lum here'],['c@','Contrast here'],['e@','Edge here'],['n@','Energy here']];
const XS={h:'hue',s:'saturation',l:'luminance',c:'contrast',e:'edge',n:'energy'};
const LANE_SRC=[['none','—']].concat(['hue','saturation','luminance','contrast','edge','energy'].map(c=>[c,c[0].toUpperCase()+c.slice(1)]),[['tension','Tension'],['stability','Stability'],['repeat','Repetition'],['presence','Presence']]);
const WAVES=[['sine','Sine'],['triangle','Triangle'],['sawtooth','Saw'],['square','Square']];

/* ---------- parameter registry: every tuned constant is a control ---------- */
const PD=[],P={},PI={};
function R(o){PD.push(o);PI[o.id]=o;P[o.id]=o.v}
const sl=(id,l,min,max,step,v,tier,g,x)=>R(Object.assign({id,l,min,max,step,v,tier,g},x||{}));
const se=(id,l,opts,v,tier,g,x)=>R(Object.assign({id,l,opts,v,tier,g,type:'sel'},x||{}));
/* tier: 1 re-analyse, 2 rebuild trees, 3 rebuild score, 4 audio only, 5 redraw */
se('cond','Conductor',[[1,'On'],[0,'Off']],1,3,'key');
se('root','Root',NOTE.map((n,i)=>[i,n]),0,3,'key');
se('mode','Scale',SCALES.map((s,i)=>[i,s[0]]),6,3,'key');
se('snap','Snap to scale',[[1,'On'],[0,'Off']],1,3,'key');
sl('bpm','Tempo',40,200,1,100,3,'key');
sl('bars','Bars',1,16,1,4,3,'key');
sl('bpb','Beats per bar',2,9,1,4,3,'key');
se('grid','Grid',[[0,'Free'],[1,'1/4'],[2,'1/8'],[4,'1/16'],[8,'1/32']],2,3,'key');
sl('swing','Swing',0,1,.01,0,3,'key');
sl('hum','Humanize ms',0,40,1,0,3,'key');
se('scan','Scan direction',[['xr','Left → right'],['xl','Right → left'],['yd','Top → bottom'],['yu','Bottom → top'],['out','Center → out'],['in','Edge → center']],'xr',3,'key');
se('loop','Loop',[[1,'On'],[0,'Off']],1,4,'key');
sl('norm','Normalize values',0,1,.01,.7,3,'key');
sl('dmax','Max note length s',.5,16,.1,6,3,'key');
sl('vmin','Min velocity',0,1,.01,.25,3,'key');
se('autoLoad','Auto on load',[[1,'On'],[0,'Off']],1,4,'auto');
sl('aModeW','Scale: brightness weight',0,1,.01,.6,4,'auto');
sl('aBpmLo','Tempo low',40,120,1,64,4,'auto');
sl('aBpmHi','Tempo high',80,200,1,128,4,'auto');
sl('aEdgeK','Edges → tempo gain',2,40,1,14,4,'auto');
sl('aSwing','Swing max',0,1,.01,.35,4,'auto');
sl('aRevLo','Reverb low',0,.8,.01,.12,4,'auto');
sl('aRevHi','Reverb high',0,.8,.01,.55,4,'auto');
sl('aDlyLo','Delay low',0,.8,.01,.05,4,'auto');
sl('aDlyHi','Delay high',0,.8,.01,.3,4,'auto');
sl('maxD','Max depth',1,8,1,6,2,'tree');
sl('minB','Min block px',2,48,1,12,2,'tree');
sl('splitK','Split sensitivity',.25,4,.01,1,2,'tree');
const THD={hue:[.06,2.2],saturation:[.07,1.8],luminance:[.08,2],contrast:[.03,6],edge:[.05,3.5],energy:[.04,4]};
CH.forEach(c=>{sl('th.'+c,CHN[c]+' split at',.005,.3,.005,THD[c][0],2,'tree');sl('gn.'+c,CHN[c]+' importance',.5,10,.1,THD[c][1],2,'tree')});
sl('hueFloor','Hue chroma floor',0,.3,.005,.05,1,'tree');
sl('wE','Energy: edges',0,2,.05,1,1,'tree');sl('wC','Energy: local contrast',0,2,.05,1,1,'tree');sl('wS','Energy: saturation',0,2,.05,.5,1,'tree');sl('wL','Energy: tonal extremes',0,2,.05,.3,1,'tree');
sl('conR','Contrast radius px',1,12,1,3,1,'tree');
sl('aSize','Analysis size px',160,900,20,640,1,'tree');
sl('imgA','Image opacity',0,1,.01,.4,5,'view');
sl('vDepth','View depth',1,8,1,8,5,'view');
sl('vFill','Block fill',0,2,.01,1,5,'view');
sl('vLine','Block lines',0,1,.01,.6,5,'view');
sl('vSnd','Sounding highlight',0,1,.01,.85,5,'view');
sl('flash','Flash length s',.05,1.5,.01,.35,5,'view');
sl('mst','Master',0,1,.01,.8,4,'fx');
sl('rev','Reverb send',0,1,.01,.25,4,'fx');
sl('revSz','Reverb size s',.3,6,.1,2.4,4,'fx');
sl('revDm','Reverb damping',0,1,.01,.5,4,'fx');
sl('dly','Delay send',0,1,.01,.12,4,'fx');
sl('dlyB','Delay beats',.125,2,.125,.75,4,'fx');
sl('dlyFb','Delay feedback',0,.85,.01,.35,4,'fx');
sl('dlyTone','Delay tone Hz',500,8000,50,3000,4,'fx');
sl('comp','Compression',0,1,.01,.4,4,'fx');
sl('maxv','Max live notes',8,120,1,48,4,'fx');
const LND={cut:['tension',.7],rev:['stability',.6],dly:['repeat',.6],lvl:['presence',.4]};
[['cut','Master filter'],['rev','Reverb'],['dly','Delay'],['lvl','Level']].forEach(([k,l])=>{se('ln.'+k+'.s',l,LANE_SRC,LND[k][0],4,'ln',{m:true});sl('ln.'+k+'.a','',-1,1,.01,LND[k][1],4,'ln',{ma:true})});
sl('lnN','Board slices',8,128,1,64,3,'ln');sl('lnSm','Glide',.05,1.5,.01,.4,4,'ln');sl('mfLo','Filter low Hz',100,4000,10,300,4,'ln');sl('mfHi','Filter high Hz',2000,20000,100,18000,4,'ln');
const MAPD={
 lead:{pitch:['val',1],lvl:['n@',.9],len:['size',-.8],tone:['e@',.8],pan:['y',.6],stk:['none',0],rev:['s@',.6],dly:['none',0]},
 pad:{pitch:['val',.7],lvl:['imp',.8],len:['none',0],tone:['l@',1],pan:['y',-.8],stk:['val',1],rev:['n@',-.6],dly:['none',0]},
 bass:{pitch:['val',1],lvl:['rel',-1],len:['size',-.4],tone:['e@',.6],pan:['none',0],stk:['none',0],rev:['none',0],dly:['none',0]},
 pluck:{pitch:['h@',1],lvl:['spr',.8],len:['spr',-.6],tone:['imp',.8],pan:['val',.6],stk:['none',0],rev:['none',0],dly:['e@',.7]},
 perc:{pitch:['y',1],lvl:['val',1],len:['size',-.5],tone:['spr',.7],pan:['rel',.6],rev:['none',0],dly:['none',0]}};
const VDEF={
 lead:{wave:'sawtooth',atk:.01,dec:.25,sus:.5,rel:.25,det:8,sub:0,lo:55,rng:26,cl:900,ch:6000,q:1,fenv:2.5,gl:.3,gh:1,stk:1,dl:3,dh:5,imp:.04,poly:3,gain:.45},
 pad:{wave:'triangle',atk:.6,dec:.6,sus:.8,rel:1.4,det:12,sub:0,lo:46,rng:19,cl:400,ch:3000,q:.7,fenv:1,gl:.9,gh:1.4,stk:3,dl:0,dh:2,imp:0,poly:2,gain:.35},
 bass:{wave:'triangle',atk:.01,dec:.3,sus:.7,rel:.15,det:0,sub:.5,lo:28,rng:19,cl:160,ch:900,q:1,fenv:2,gl:.5,gh:1,stk:1,dl:1,dh:3,imp:.04,poly:1,gain:.6},
 pluck:{wave:'square',atk:.002,dec:.3,sus:0,rel:.12,det:6,sub:0,lo:64,rng:26,cl:600,ch:5000,q:3,fenv:3,gl:.1,gh:.5,stk:1,dl:3,dh:6,imp:.04,poly:3,gain:.32},
 perc:{gain:.6,dl:4,dh:6,imp:.04,poly:3}};
const TG=p=>p?[['pitch','Drum'],['lvl','Level'],['len','Decay'],['tone','Tone'],['pan','Pan'],['rev','Reverb'],['dly','Delay']]:[['pitch','Pitch'],['lvl','Level'],['len','Length'],['tone','Tone'],['pan','Pan'],['stk','Chord'],['rev','Reverb'],['dly','Delay']];
VOICES.forEach(V=>{const id=V.id,D=VDEF[id],isP=V.type==='perc',gm='map.'+id,gs='snd.'+id,gr='rt.'+id;
 se(id+'.rd','Reads tree',CH.map(c=>[c,CHN[c]]),V.ch,3,gr);
 TG(isP).forEach(([t,l])=>{se(id+'.'+t+'.s',l,SRC_OPTS,MAPD[id][t][0],3,gr,{m:true});sl(id+'.'+t+'.a','',-1,1,.01,MAPD[id][t][1],3,gr,{ma:true})});
 se(id+'.inst','Instrument',()=>instOpts(V),'syn',4,gs);
 sl(id+'.dl','Depth from',0,8,1,D.dl,3,gm);sl(id+'.dh','Depth to',0,8,1,D.dh,3,gm);
 sl(id+'.imp','Importance gate',0,1,.01,D.imp,3,gm);sl(id+'.poly','Notes per slot',1,8,1,D.poly,3,gm);
 sl(id+'.cmin','Hue chroma gate',0,.3,.005,.04,3,gm);sl(id+'.rg','vs-parent ceiling',-.2,1,.01,id==='bass'?.02:1,3,gm);
 if(!isP){se(id+'.wave','Wave',WAVES,D.wave,4,gs);sl(id+'.atk','Attack s',.001,2,.001,D.atk,4,gs);sl(id+'.dec','Decay s',.02,2,.01,D.dec,4,gs);sl(id+'.sus','Sustain',0,1,.01,D.sus,4,gs);sl(id+'.rel','Release s',.02,3,.01,D.rel,4,gs);
  sl(id+'.det','Detune cents',0,40,1,D.det,4,gs);sl(id+'.sub','Sub osc',0,1,.01,D.sub,4,gs);sl(id+'.lo','Low note',24,84,1,D.lo,3,gs);sl(id+'.rng','Range semis',5,48,1,D.rng,3,gs);
  sl(id+'.cl','Filter low Hz',80,4000,10,D.cl,3,gs);sl(id+'.ch','Filter high Hz',300,16000,50,D.ch,3,gs);sl(id+'.q','Resonance',.2,12,.1,D.q,4,gs);sl(id+'.fenv','Filter open ×',1,8,.1,D.fenv,4,gs);
  sl(id+'.gl','Gate min',.05,2,.01,D.gl,3,gs);sl(id+'.gh','Gate max',.1,3,.01,D.gh,3,gs);sl(id+'.stk','Chord max',1,4,1,D.stk,3,gs)}
 sl(id+'.gain',V.name,0,1,.01,D.gain,4,'mix')});
sl('perc.kf','Kick Hz',30,120,1,55,4,'snd.perc');sl('perc.kd','Kick decay s',.05,.8,.01,.25,4,'snd.perc');
sl('perc.sf','Snare tone Hz',120,400,1,190,4,'snd.perc');sl('perc.sd','Snare decay s',.05,.5,.01,.16,4,'snd.perc');
sl('perc.hf','Hat Hz',3000,12000,100,7000,4,'snd.perc');sl('perc.hd','Hat decay s',.02,.3,.01,.06,4,'snd.perc');
sl('perc.zl','Kick below',0,1,.01,.35,3,'snd.perc');sl('perc.zh','Hat above',0,1,.01,.65,3,'snd.perc');

/* ---------- state ---------- */
let LANE=null,A=null,IMG=null,FNAME='',RAW=null,SRC=null,CORE=null,RZ=0,EV=[],SCN=[],VIEW='all',SEL=null,TAB='read',VSEL='lead',DECK=true,FIT=null,ALOG=[],JBOX='',DIRTY=9,TM=0;
const rd=V=>P[V.id+'.rd'];
const MUTE={},OPEN={read0:true,rt:true,map:true,tree:true,time:true,lv:true},VQ=[];let FL=[],ovRaf=0;

/* ---------- analysis: summed-area tables make every block stat O(1) ---------- */
function analyzeCore(){
 const {d,w,h}=RAW,N=w*h,W1=w+1;
 const L=new Float32Array(N),S=new Float32Array(N),E=new Float32Array(N),LC=new Float32Array(N),HC=new Float32Array(N),HS=new Float32Array(N),HW=new Float32Array(N);
 let sR=0,sB=0,sL=0,sL2=0,sS=0,hcnt=0;const hist=new Array(32).fill(0),hb=new Array(8).fill(0),cm={},fl=P.hueFloor;
 for(let i=0,p=0;i<N;i++,p+=4){
  const r=d[p]/255,g=d[p+1]/255,b=d[p+2]/255,l=.299*r+.587*g+.114*b,mx=Math.max(r,g,b),mn=Math.min(r,g,b),df=mx-mn;
  L[i]=l;S[i]=mx>0?df/mx:0;sR+=r;sB+=b;sL+=l;sL2+=l*l;sS+=S[i];hist[Math.min(31,l*32|0)]++;
  let hh=0;if(df>0){if(mx===r)hh=((g-b)/df*60+360)%360;else if(mx===g)hh=(b-r)/df*60+120;else hh=(r-g)/df*60+240}
  if(df>=fl&&df>0){const a=hh*Math.PI/180;HC[i]=Math.cos(a)*df;HS[i]=Math.sin(a)*df;HW[i]=df}
  if(df>=.15&&mx>=.1){hb[Math.floor(hh/45)%8]++;hcnt++}
  if(i%4===0){const k=(d[p]&224)+','+(d[p+1]&224)+','+(d[p+2]&224);cm[k]=(cm[k]||0)+1}

/* ---------- audio ---------- */
let AC=null,comp,mf,mst,dry,rvIn,conv,rvOut,dlIn,dly,fbk,dlf,dlOut,noiseBuf,irKey='',active=0;const bus=[];
function initAudio(){
 if(AC){if(AC.resume)AC.resume();return true}
 const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;
 AC=new C();comp=AC.createDynamicsCompressor();mf=AC.createBiquadFilter();mf.type='lowpass';mf.Q.value=.5;mf.frequency.value=P.mfHi;mst=AC.createGain();comp.connect(mf);mf.connect(mst);mst.connect(AC.destination);
 dry=AC.createGain();dry.connect(comp);
 rvIn=AC.createGain();conv=AC.createConvolver();rvOut=AC.createGain();rvIn.connect(conv);conv.connect(rvOut);rvOut.connect(comp);
 dlIn=AC.createGain();dly=AC.createDelay(2);fbk=AC.createGain();dlf=AC.createBiquadFilter();dlf.type='lowpass';dlOut=AC.createGain();
 dlIn.connect(dly);dly.connect(dlf);dlf.connect(fbk);fbk.connect(dly);dlf.connect(dlOut);dlOut.connect(comp);
 noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
 makeBuses();applyMix();if(AC.resume)AC.resume();return true;
}
function makeBuses(){
 VOICES.forEach((V,i)=>{
  if(bus[i])for(const k of['d','r','l']){try{bus[i][k].disconnect()}catch(e){}}
  const g=MUTE[V.id]?0:P[V.id+'.gain'],d=AC.createGain(),r=AC.createGain(),l=AC.createGain();
  d.gain.value=r.gain.value=l.gain.value=g;d.connect(dry);r.connect(rvIn);l.connect(dlIn);bus[i]={d,r,l};
 });
}
function makeIR(){
 const sr=AC.sampleRate,len=Math.max(1,Math.floor(P.revSz*sr)),b=AC.createBuffer(2,len,sr),co=1-P.revDm*.95;
 for(let c=0;c<2;c++){const d=b.getChannelData(c);let lp=0;for(let i=0;i<len;i++){lp+=((Math.random()*2-1)-lp)*co;d[i]=lp*Math.pow(1-i/len,2.5)}}
 conv.buffer=b;irKey=P.revSz+'|'+P.revDm;
}
function applyMix(){
 if(!AC)return;const t=AC.currentTime;
 const lk=L=>PL.on&&LANE&&P['ln.'+L+'.s']!=='none';
 if(!lk('lvl'))mst.gain.setTargetAtTime(P.mst,t,.02);if(!lk('rev'))rvIn.gain.setTargetAtTime(P.rev,t,.02);if(!lk('dly'))dlIn.gain.setTargetAtTime(P.dly,t,.02);if(!lk('cut'))mf.frequency.setTargetAtTime(P.mfHi,t,.02);
 dly.delayTime.setTargetAtTime(Math.min(1.9,P.dlyB*60/P.bpm),t,.05);fbk.gain.setTargetAtTime(P.dlyFb,t,.02);dlf.frequency.setTargetAtTime(P.dlyTone,t,.02);
 comp.threshold.value=-8-26*P.comp;comp.ratio.value=1+11*P.comp;comp.knee.value=12;
 VOICES.forEach((V,i)=>{if(bus[i]){const g=MUTE[V.id]?0:P[V.id+'.gain'];for(const k of['d','r','l'])bus[i][k].gain.setTargetAtTime(g,t,.02)}});
 if(irKey!==P.revSz+'|'+P.revDm)makeIR();
}
function outTo(node,pan,V,e){
 let o=node;if(AC.createStereoPanner){const sp=AC.createStereoPanner();sp.pan.value=clamp(pan,-1,1);node.connect(sp);o=sp}
 const b=bus[V.i];o.connect(b.d);
 if(e.rv>.001){const g=AC.createGain();g.gain.value=e.rv;o.connect(g);g.connect(b.r)}
 if(e.dl>.001){const g=AC.createGain();g.gain.value=e.dl;o.connect(g);g.connect(b.l)}
}
function note(V,e,t){
 if(INST[V.i]!=null){sfNote(V,e,t,INST[V.i]);return}
 const id=V.id,g=k=>P[id+'.'+k],dur=e.dur,atk=g('atk'),dec=Math.max(.02,g('dec')),sus=Math.max(.0001,g('sus')),rel=g('rel'),end=t+dur,det=g('det'),sub=g('sub');
 const peak=e.vel*.5/Math.sqrt(e.m.length*(det>0?2:1)),env=AC.createGain(),ga=env.gain;let lvl;
 ga.setValueAtTime(.0001,t);
 if(dur<=atk){lvl=Math.max(.0001,peak*dur/atk);ga.linearRampToValueAtTime(lvl,end)}
 else{ga.linearRampToValueAtTime(peak,t+atk);const dd=Math.min(end-t-atk,dec);lvl=Math.max(.0001,peak*Math.pow(sus,dd/dec));ga.exponentialRampToValueAtTime(lvl,t+atk+dd)}
 ga.setValueAtTime(lvl,end);ga.setTargetAtTime(0,end,rel/3);
 const stopT=end+rel*1.8+.05,fl=AC.createBiquadFilter();fl.type='lowpass';fl.Q.value=g('q');
 const c0=Math.min(16000,e.cut*g('fenv'));fl.frequency.setValueAtTime(c0,t);if(g('fenv')>1.001)fl.frequency.exponentialRampToValueAtTime(Math.max(20,e.cut),t+Math.max(.05,dec));
 fl.connect(env);outTo(env,e.pan,V,e);
 let first=true;
 for(const m of e.m){
  const fr=440*Math.pow(2,(m-69)/12);
  for(const dc of(det>0?[-det/2,det/2]:[0])){const o=AC.createOscillator();o.type=g('wave');o.frequency.value=fr;o.detune.value=dc;o.connect(fl);o.start(t);o.stop(stopT);if(first){o.onended=()=>{active=Math.max(0,active-1)};first=false}}
  if(sub>0){const o=AC.createOscillator(),sg=AC.createGain();o.type='sine';o.frequency.value=fr/2;sg.gain.value=sub;o.connect(sg);sg.connect(fl);o.start(t);o.stop(stopT)}
 }

}
function perc(V,e,t){
 if(INST[V.i]!=null){sfDrum(V,e,t,INST[V.i]);return}

 if(e.kind==='k'){
  const o=AC.createOscillator(),f=P['perc.kf']*(.9+.2*e.tp),d=P['perc.kd']*dm;
  o.frequency.setValueAtTime(f*3,t);o.frequency.exponentialRampToValueAtTime(f,t+.05);gn.gain.setValueAtTime(vel*.9,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(gn);outTo(gn,e.pan,V,e);o.start(t);o.stop(t+d+.05);return;
 }
 const src=AC.createBufferSource(),fl=AC.createBiquadFilter();src.buffer=noiseBuf;
 if(e.kind==='h'){
  const d=P['perc.hd']*dm;fl.type='highpass';fl.frequency.value=P['perc.hf']*(.7+.6*e.tp);gn.gain.setValueAtTime(vel*.5,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);
  src.connect(fl);fl.connect(gn);outTo(gn,e.pan,V,e);src.start(t,Math.random()*.5);src.stop(t+d+.02);
 }else{
  const d=P['perc.sd']*dm,o=AC.createOscillator(),og=AC.createGain();
  fl.type='bandpass';fl.Q.value=.8;fl.frequency.value=P['perc.sf']*5*(.85+.3*e.tp);gn.gain.setValueAtTime(vel*.6,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);
  o.type='triangle';o.frequency.value=P['perc.sf']*(.85+.3*e.tp);og.gain.setValueAtTime(vel*.35,t);og.gain.exponentialRampToValueAtTime(.001,t+d*.6);
  src.connect(fl);fl.connect(gn);o.connect(og);og.connect(gn);outTo(gn,e.pan,V,e);src.start(t,Math.random()*.5);src.stop(t+d+.02);o.start(t);o.stop(t+d+.02);
 }
}
function fire(e,when){
 const V=VOICES[e.v];if(MUTE[V.id]||active>P.maxv)return;
 if(V.type==='perc')perc(V,e,when);else note(V,e,when);

/* ---------- transport ---------- */
const PL={on:false,t0:0,off:0,idx:0,hz:0,tm:0,nx:null};
function play(){
 if(!A||!A.trees){updateHud('Load an image first');return}
 if(!initAudio()){updateHud('Web Audio unavailable');return}
 MEM=freshMem();buildScore();
 if(!EV.length){updateHud('No notes: widen depth windows or lower gates');return}
 PL.on=true;PL.t0=AC.currentTime+.1;PL.lnT=PL.t0;PL.lnK=0;PL.off=PL.t0;PL.idx=0;PL.hz=PL.t0;PL.tm=setInterval(tick,25);

}
function stop(){
 if(!PL.on)return;PL.on=false;clearInterval(PL.tm);

 $('play').textContent='▶ Play';MEM=freshMem();buildScore();drawBase();startOv();
}
function tick(){
 if(!AC)return;if(AC.state==='suspended'&&AC.resume)AC.resume();
 const T=totalSec(),now=AC.currentTime,hz=now+.25;
 if(P.cond&&P.loop&&NEXT&&!PL.nx&&now>PL.off+T*.5)PL.nx={mem:NEXT,r:conduct(NEXT.pass,NEXT)};
 if(!EV.length){stop();return}
 for(let guard=0;guard<5000;guard++){
  if(PL.idx>=EV.length){if(P.loop){if(P.cond&&NEXT)rollPass();PL.idx=0;PL.off+=T;continue}if(now>PL.off+T+2.5)stop();break}
  const e=EV[PL.idx],tt=PL.off+e.t;if(tt>hz)break;
  if(tt>=now-.05)fire(e,Math.max(tt,now));PL.idx++;
 }
 if(LANE&&LANE.hue.length===Math.round(P.lnN)){const N=Math.round(P.lnN),step=T/N;for(let g2=0;g2<400&&PL.lnT<hz;g2++){applyLane(PL.lnK%N,Math.max(PL.lnT,now),step);PL.lnT+=step;PL.lnK++}}

}
function repos(){if(!PL.on||!AC)return;const pos=PL.hz-PL.off;let i=0;while(i<EV.length&&EV[i].t<=pos)i++;PL.idx=i}

/* ---------- drawing ---------- */
function fit(sw,sh){if(!A||!A.dimensions)return{x:0,y:0,w:sw,h:sh,s:1};const w=A.dimensions.width,h=A.dimensions.height,s=Math.min(sw/w,sh/h);return{x:(sw-w*s)/2,y:(sh-h*s)/2,w:w*s,h:h*s,s}}
function sizeCanvases(){
 const st=$('stage'),sw=st.clientWidth,sh=st.clientHeight,dpr=Math.min(2,window.devicePixelRatio||1);
 for(const id of['cv','ov']){const c=$(id),pw=Math.round(sw*dpr),ph=Math.round(sh*dpr);if(c.width!==pw||c.height!==ph){c.width=pw;c.height=ph}c.style.width=sw+'px';c.style.height=sh+'px'}

}
function drawBase(){

 if(P.imgA>0){c.globalAlpha=P.imgA;c.drawImage(SRC,FIT.x,FIT.y,FIT.w,FIT.h);c.globalAlpha=1}
 if(!A.trees)return;
 const s=FIT.s,list=VIEW==='all'?VOICES:[VOICES.find(v=>v.id===VIEW)];
 for(const V of list){
  const tc=rd(V),T=A.trees[tc];
  for(const n of T.nodes){
   if(n.depth>P.vDepth)continue;
   const x=FIT.x+n.x0*s,y=FIT.y+n.y0*s,ww=(n.x1-n.x0)*s,hh=(n.y1-n.y0)*s,sd=(n.sv>>V.i)&1;

    c.strokeRect(x+.5,y+.5,Math.max(0,ww-1),Math.max(0,hh-1));
   }else if(sd){
    c.strokeStyle=hexA(V.color,P.vSnd*.8);c.lineWidth=1;c.strokeRect(x+.5,y+.5,Math.max(0,ww-1),Math.max(0,hh-1));
   }
  }
 }
}
function hexA(h,a){return`rgba(${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)},${clamp(a).toFixed(2)})`}

 for(let i=VQ.length-1;i>=0;i--)if(VQ[i].t<=now){FL.push(VQ[i]);VQ.splice(i,1)}

 for(const f of FL){const a=1-(now-f.t)/P.flash,n=f.n;c.fillStyle=hexA(f.c,a*.5);c.fillRect(FIT.x+n.x0*s,FIT.y+n.y0*s,(n.x1-n.x0)*s,(n.y1-n.y0)*s)}

}

 if(TAB==='read')h=paneRead();
 else if(TAB==='map'){const V=VOICES.find(v=>v.id===VSEL);h=vchips()+det('rt','Routing · '+V.name,cells('rt.'+VSEL),true)+det('map','Depth & gates',cells('map.'+VSEL),true)}
 else if(TAB==='snd'){h=vchips()+sfRow()+cells('snd.'+VSEL)}
 else if(TAB==='key')h=det('time','Time & key',cells('key'),true)+det('auto','Auto from image',cells('auto'));
 else if(TAB==='mix')h=det('lv','Levels',cells('mix'),true)+det('fx','Space & dynamics',cells('fx'))+det('ln','Image → board (acts under the playhead)',cells('ln'),true);
 else if(TAB==='tree')h=det('tree','Quadtree',cells('tree'),true)+det('view','Display',cells('view'),true);
 p.innerHTML=h;
}
function syncAfterAuto(){renderPane();schedule(3)}

/* ---------- param flow ---------- */
function schedule(t){DIRTY=Math.min(DIRTY,t);clearTimeout(TM);TM=setTimeout(flush,t===1?10:70)}
function rasterize(){
 const iw=IMG.naturalWidth||IMG.width,ih=IMG.naturalHeight||IMG.height,s=Math.min(1,P.aSize/Math.max(iw,ih)),w=Math.max(2,Math.round(iw*s)),h=Math.max(2,Math.round(ih*s));
 const oc=document.createElement('canvas');oc.width=w;oc.height=h;const x=oc.getContext('2d',{willReadFrequently:true});x.drawImage(IMG,0,0,w,h);
 SRC=oc;RAW={d:x.getImageData(0,0,w,h).data,w,h,name:FNAME};RZ=P.aSize;
}
function flush(){
 const lvl=DIRTY;DIRTY=9;
 if(lvl<=1&&IMG){if(RZ!==P.aSize||!RAW)rasterize();analyzeCore()}
 if(lvl<=2&&CORE){buildTrees();buildMaster();MEM=freshMem();resolveInst()}
 if(lvl<=3){SEL=SEL&&A&&A.trees&&A.trees[SEL.ch].nodes[SEL.i]?SEL:null;buildScore();repos()}
 applyMix();drawBase();drawOv();updateHud();
 if(lvl<=1&&TAB==='read')renderPane();
}
function onParam(d){if(d.tier<=3)schedule(d.tier);else if(d.tier===4)applyMix();else{drawBase();drawOv()}}
function onInput(e){
 const el=e.target,id=el.dataset&&el.dataset.id;if(!id)return;const d=PI[id];if(!d)return;
 const isR=el.type==='range';
 if(e.type==='change'&&isR&&d.tier!==1)return;
 P[id]=typeof d.v==='number'?+el.value:el.value;
 if(id.slice(-5)==='.inst')resolveInst();
 const ro=$('pane').querySelector('[data-v="'+id+'"]');if(ro)ro.textContent=fmt(d);
 if(d.tier===1&&e.type==='input')return;
 onParam(d);
}

/* ---------- load / export ---------- */
function loadFile(file){
 const img=new Image(),url=URL.createObjectURL(file);
 img.onload=()=>{
  IMG=img;FNAME=file.name;rasterize();analyzeCore();buildTrees();buildMaster();MEM=freshMem();SEL=null;resolveInst();
  if(P.autoLoad)autoFromImage();
  buildScore();applyMix();drawBase();drawOv();renderChips();renderPane();updateHud();
 };
 img.onerror=()=>updateHud('Could not read that image');
 img.src=url;
}
async function giveFile(blob,name){
 try{const f=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return true}}catch(e){if(e&&e.name==='AbortError')return true}
 return false;
}
function putText(txt,label){
 JBOX=txt;OPEN.read4=true;TAB='read';DECK=true;layout();renderPane();
 const done=()=>updateHud(label+' · copied');
 try{(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(done,()=>updateHud(label+' · select text in the box'))}catch(e){updateHud(label+' · select text in the box')}
}
function exportJson(){
 if(!A){updateHud('Nothing to export');return}
 putText(JSON.stringify({source:A.source,dimensions:A.dimensions,global:A.global,hue_distribution:A.hue_distribution,dominant_colors:A.dominant_colors,music:{key:NOTE[P.root],scale:SCALES[P.mode][0],bpm:P.bpm,bars:P.bars},params:P}),'JSON');
}
function exportScore(){
 if(!EV.length){updateHud('No score yet');return}
 putText(JSON.stringify({bpm:P.bpm,bars:P.bars,beatsPerBar:P.bpb,key:NOTE[P.root],scale:SCALES[P.mode][0],notes:EV.map(e=>({t:+e.t.toFixed(3),voice:VOICES[e.v].id,midi:e.m||null,drum:e.kind||null,dur:e.dur?+e.dur.toFixed(3):null,vel:+e.vel.toFixed(2)}))}),'Score');
}
function loadJson(){
 const box=$('jbox');if(box)JBOX=box.value;
 try{
  const o=JSON.parse(JBOX.trim());let did=false;
  if(o.params){for(const k in PI)if(k in o.params&&typeof o.params[k]===typeof PI[k].v){P[k]=o.params[k];did=true}}
  if(o.global&&!IMG){A={source:o.source||'json',dimensions:o.dimensions||{width:1,height:1},global:o.global,hue_distribution:o.hue_distribution||{},dominant_colors:o.dominant_colors||[],trees:null};SRC=null;CORE=null;EV=[];did=true;if(P.autoLoad&&!o.params)autoFromImage()}
  if(!did){updateHud('Nothing usable in that JSON');return}
  applyMix();renderPane();schedule(IMG?1:3);if(!IMG){drawBase();updateHud()}
 }catch(e){updateHud('Invalid JSON: '+e.message)}
}
function buildMidi(){
 const PPQ=480,bs=60/P.bpm,tk=s=>Math.round(s/bs*PPQ);
 const be=(n,b)=>{const a=[];for(let i=b-1;i>=0;i--)a.push((n>>>(8*i))&255);return a};
 const vlq=n=>{const a=[n&127];while((n>>=7)>0)a.unshift((n&127)|128);return a};
 const nm=s=>[0,255,3,s.length].concat(Array.from(s).map(c=>c.charCodeAt(0)&127));
 const trk=ev=>{ev.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);let last=0;const o=[];for(const[t,,by]of ev){const v=vlq(t-last);for(const x of v)o.push(x);for(const x of by)o.push(x);last=t}o.push(0,255,47,0);return[77,84,114,107].concat(be(o.length,4),o)};
 const tracks=[trk([[0,-2,[255,81,3].concat(be(Math.round(6e7/P.bpm),3))],[0,-2,[255,88,4,P.bpb,2,24,8]]])];
 const DR={k:36,s:38,h:42};
 VOICES.forEach((V,vi)=>{
  const ev=[[0,-1,[0xC0|V.mch,V.prog]]];
  EV.filter(e=>e.v===vi).forEach(e=>{
   const on=tk(e.t),vel=clamp(Math.round(e.vel*127),1,127);
   if(V.type==='perc'){ev.push([on,1,[0x90|V.mch,DR[e.kind],vel]],[on+Math.max(1,tk(.1)),0,[0x80|V.mch,DR[e.kind],0]])}
   else e.m.forEach(m=>{ev.push([on,1,[0x90|V.mch,m,vel]],[on+Math.max(1,tk(e.dur)),0,[0x80|V.mch,m,0]])});
  });
  const t=trk(ev);tracks.push(t);
 });
 const hdr=[77,84,104,100].concat(be(6,4),[0,1],be(tracks.length,2),be(PPQ,2));
 let all=hdr;tracks.forEach(t=>{all=all.concat(t)});return new Uint8Array(all);
}
async function exportMidi(){
 if(!EV.length){updateHud('No score yet');return}
 const bytes=buildMidi(),blob=new Blob([bytes],{type:'audio/midi'});
 if(await giveFile(blob,'quadtree_sonic.mid'))return;
 let s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
 putText('MIDI base64 (decode to .mid): '+btoa(s),'MIDI');
}
function savePng(){
 if(!A||!SRC){updateHud('Nothing to save');return}
 const t=document.createElement('canvas');t.width=$('cv').width;t.height=$('cv').height;const c=t.getContext('2d');c.drawImage($('cv'),0,0);c.drawImage($('ov'),0,0);
 t.toBlob(async b=>{if(b&&await giveFile(b,'quadtree_'+VIEW+'.png'))return;$('imgsrc').src=t.toDataURL('image/png');$('imgov').style.display='flex'},'image/png');
}

/* ---------- events ---------- */
$('file').addEventListener('change',e=>{if(e.target.files[0])loadFile(e.target.files[0]);e.target.value=''});
$('sf').addEventListener('change',e=>{if(e.target.files[0])loadSF(e.target.files[0]);e.target.value=''});
$('play').addEventListener('click',()=>{PL.on?stop():play()});
$('imgov').addEventListener('click',()=>{$('imgov').style.display='none'});
$('chs').addEventListener('click',e=>{
 const m=e.target.closest('[data-mute]');
 if(m){const id=m.dataset.mute;MUTE[id]=!MUTE[id];applyMix();renderChips();return}
 const v=e.target.closest('[data-view]');if(v){VIEW=v.dataset.view;SEL=null;renderChips();drawBase();drawOv();updateHud()}
});
$('tabs').addEventListener('click',e=>{
 if(e.target.closest('[data-fold]')){DECK=!DECK;layout();return}
 const t=e.target.closest('[data-tab]');if(!t)return;
 if(TAB===t.dataset.tab&&DECK){DECK=false}else{TAB=t.dataset.tab;DECK=true}
 layout();if(DECK){renderPane();$('pane').scrollTop=0}
});
const pane=$('pane');
pane.addEventListener('input',onInput);pane.addEventListener('change',onInput);
pane.addEventListener('toggle',e=>{if(e.target.dataset&&e.target.dataset.k)OPEN[e.target.dataset.k]=e.target.open},true);
pane.addEventListener('click',e=>{
 const vs=e.target.closest('[data-vs]');if(vs){VSEL=vs.dataset.vs;renderPane();return}
 const a=e.target.closest('[data-act]');if(!a)return;
 const k=a.dataset.act;
 if(k==='auto'){if(!A){updateHud('Load an image first');return}autoFromImage();syncAfterAuto()}
 else if(k==='cj')exportJson();else if(k==='cs')exportScore();else if(k==='midi')exportMidi();else if(k==='png')savePng();else if(k==='lj')loadJson();else if(k==='sf')$('sf').click();
});
pane.addEventListener('input',e=>{if(e.target.id==='jbox')JBOX=e.target.value});
$('ov').addEventListener('click',ev=>{
 if(!A||!A.trees||!FIT)return;
 const r=$('ov').getBoundingClientRect(),x=(ev.clientX-r.left-FIT.x)/FIT.s,y=(ev.clientY-r.top-FIT.y)/FIT.s;
 if(x<0||y<0||x>=A.dimensions.width||y>=A.dimensions.height)return;
 let best=null,bv=null;
 for(const V of(VIEW==='all'?VOICES:[VOICES.find(v=>v.id===VIEW)])){
  let hit=null;for(const n of A.trees[rd(V)].nodes)if(n.depth<=P.vDepth&&x>=n.x0&&x<n.x1&&y>=n.y0&&y<n.y1)hit=n;
  if(hit&&(!best||(hit.x1-hit.x0)*(hit.y1-hit.y0)<(best.x1-best.x0)*(best.y1-best.y0))){best=hit;bv=V}
 }
 SEL=best?{ch:rd(bv),i:best.i}:null;
 if(best&&initAudio())fire(evFor(bv.i,best,A.trees[rd(bv)]),AC.currentTime+.01);
 updateHud();drawOv();startOv();
});
window.addEventListener('resize',layout);window.addEventListener('orientationchange',()=>setTimeout(layout,200));
renderChips();layout();renderPane();
</script>
