<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AXIOM-OS // SAMPLE VOICES</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#09090b; --card:#141417; --border:#27272a; --muted:#71717a; --bright:#f4f4f5;
    --v1:#3b82f6; --v2:#10b981; --v3:#f59e0b; --v4:#ffe600;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);color:var(--bright);
    font-family:"Share Tech Mono","SFMono-Regular",Consolas,monospace;
    font-size:13px;min-height:100vh;-webkit-text-size-adjust:100%;}
  #app{max-width:540px;margin:0 auto;padding:12px 12px 40px;}
  header{display:flex;align-items:center;justify-content:space-between;
    padding:6px 2px 12px;border-bottom:1px solid var(--border);margin-bottom:12px;}
  .sys-tag{font-weight:700;letter-spacing:.08em;font-size:12px;}
  .sys-status{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);}
  .dot{width:6px;height:6px;border-radius:50%;background:#666;transition:all 0.2s;}
  .dot.live{background:#ff0;box-shadow:0 0 8px #ff0;}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:4px;
    padding:10px;margin-bottom:10px;}
  .lbl{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);
    font-weight:700;margin-bottom:8px;}

  /* VOICE CARDS */
  .voice{display:flex;flex-direction:column;gap:8px;padding:10px;border:2px solid var(--border);
    border-radius:4px;margin-bottom:10px;background:#0c0c0e;}
  .voice:last-child{margin-bottom:0;}
  .vhead{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);padding-bottom:8px;}
  .vhead input[type=range]{min-width:44px;}
  .vname{font-weight:700;font-size:13px;letter-spacing:.02em;flex-shrink:0;}
  .vnote{font-size:11px;font-variant-numeric:tabular-nums;font-weight:600;flex-shrink:0;}

  .vrow{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .vrow:last-child{margin-bottom:0;}
  .loadbtn{flex-shrink:0;padding:6px 10px;background:var(--card);border:1px solid var(--border);
    color:var(--bright);border-radius:3px;font:inherit;font-size:11px;cursor:pointer;
    text-transform:uppercase;letter-spacing:.05em;}
  .loadbtn:active{background:#1c1c22;}
  .vsrc{flex:1;min-width:0;font-size:9px;color:var(--muted);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;}
  .vsrc.loaded{color:#fff;font-weight:600;}

  /* RECORD BUTTON (per-voice color-automation) */
  .recbtn{flex-shrink:0;padding:6px 10px;background:var(--card);border:1px solid var(--border);
    color:var(--bright);border-radius:3px;font:inherit;font-size:11px;cursor:pointer;
    text-transform:uppercase;letter-spacing:.05em;}
  .recbtn:active{background:#1c1c22;}
  .recbtn.recording{background:#ef4444;border-color:#ef4444;color:#fff;animation:recpulse 1s infinite;}
  .recbtn.hasseq{background:#1c1c22;border-color:currentColor;}
  @keyframes recpulse{0%,100%{opacity:1;}50%{opacity:.5;}}

  /* PITCH SWATCH (per-voice color -> note) */
  .swatch{-webkit-appearance:none;appearance:none;width:26px;height:26px;flex-shrink:0;
    border:1px solid var(--border);border-radius:6px;background:none;cursor:pointer;padding:0;}
  .swatch::-webkit-color-swatch-wrapper{padding:2px;}
  .swatch::-webkit-color-swatch{border:none;border-radius:4px;}

  /* INTERVAL / PATTERN ROWS */
  .interval-ctrl{display:flex;align-items:center;gap:8px;}
  .intlbl{font-size:9px;color:var(--muted);flex-shrink:0;width:60px;}
  .intval{font-size:11px;font-weight:600;width:35px;text-align:center;}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:3px;background:var(--border);
    border-radius:2px;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:14px;width:14px;border-radius:50%;
    background:currentColor;}
  input[type=range]::-moz-range-thumb{height:14px;width:14px;border:none;border-radius:50%;background:currentColor;}

  /* BAR STRIP */
  .barstrip{display:flex;gap:2px;margin-top:2px;overflow-x:auto;padding:2px 0 4px;}
  .barcell{flex:1 0 12px;min-width:12px;height:26px;background:#0c0c0e;border:1px solid var(--border);
    border-radius:2px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;padding:2px;}
  .barcell.now{border-color:#fff;box-shadow:0 0 6px rgba(255,255,255,.5);}
  .bardot{width:100%;height:3px;border-radius:1px;flex-shrink:0;}

  /* CONTROLS */
  .srow{display:flex;justify-content:space-between;align-items:center;margin:8px 0;}
  .srow label{font-size:10px;color:#a1a1aa;}
  .sv{font-size:11px;font-weight:700;}
  .sld{-webkit-appearance:none;appearance:none;width:100%;height:3px;background:var(--border);
    border-radius:2px;margin:4px 0;}
  .sld::-webkit-slider-thumb{-webkit-appearance:none;height:14px;width:14px;border-radius:50%;
    background:#3b82f6;}
  .sld::-moz-range-thumb{height:14px;width:14px;border:none;border-radius:50%;background:#3b82f6;}

  .btnrow{display:flex;gap:7px;}
  .btn{flex:1;background:var(--card);border:1px solid var(--border);color:var(--bright);
    padding:9px;border-radius:4px;font:inherit;font-size:11px;text-transform:uppercase;
    letter-spacing:.05em;cursor:pointer;}
  .btn:active{background:#1c1c22;}
  .btn.play{font-weight:700;}
  .btn.play.on{background:#ef4444;border-color:#ef4444;color:#fff;}

  #log{font-size:9px;color:#a1a1aa;padding:8px 2px 0;border-top:1px solid var(--border);
    margin-top:8px;min-height:16px;}
  #log b{color:#10b981;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="sys-tag">AXIOM-OS // SAMPLE VOICES</div>
    <div class="sys-status"><span class="dot" id="dot"></span><span id="stxt">IDLE</span></div>
  </header>

  <!-- VOICE SAMPLES -->
  <div class="panel">
    <div class="lbl">Voices · sample · swatch = pitch · pattern per voice</div>
    <div id="voicesContainer"></div>
  </div>

  <!-- BAR -->
  <div class="panel">
    <div class="lbl">Bar · shared polyrhythm cycle length</div>
    <div class="srow"><label>Pulses per bar</label><span class="sv" id="vBarLen">16</span></div>
    <input type="range" class="sld" id="sBarLen" min="4" max="32" step="1" value="16">
    <div id="barStrip" class="barstrip"></div>
  </div>

  <!-- CONTROLS -->
  <div class="panel">
    <div class="lbl">Engine</div>
    <div class="srow"><label>BPM / Clock rate</label><span class="sv" id="vBPM">120</span></div>
    <input type="range" class="sld" id="sBPM" min="40" max="240" step="1" value="120">

    <div class="srow"><label>Trigger rate (pulses/beat)</label><span class="sv" id="vRate">2</span></div>
    <input type="range" class="sld" id="sRate" min="0.5" max="8" step="0.5" value="2">

    <div class="srow"><label>Master gain</label><span class="sv" id="vGain">0.60</span></div>
    <input type="range" class="sld" id="sGain" min="0" max="1" step="0.02" value="0.6">

    <div class="srow"><label>Scan hue</label><span class="sv" id="vScan">OFF</span></div>
    <input type="range" class="sld" id="sScan" min="0" max="60" step="1" value="0">

    <div class="btnrow" style="margin-top:12px;">
      <button class="btn play" id="btnPlay">▶ ENGAGE</button>
    </div>
    <div id="log">Ready. Load samples, set pattern, then ENGAGE.</div>
  </div>
</div>

<script>
const MIDINAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const hueToNote = h => ((Math.round(h/30) % 12) + 12) % 12;
// MIDI 60 = C4, matching the sampler's "C4" anchor.
const midiToName = m => MIDINAMES[((m%12)+12)%12] + (Math.floor(m/12) - 1);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const $ = id => document.getElementById(id);

// VOICE SETUP
const VOICES = {
  v1: { label:'VOICE 1', color:'--v1', hex:'#3b82f6' },
  v2: { label:'VOICE 2', color:'--v2', hex:'#10b981' },
  v3: { label:'VOICE 3', color:'--v3', hex:'#f59e0b' },
  v4: { label:'VOICE 4', color:'--v4', hex:'#ffe600' },
};
const VKEYS = Object.keys(VOICES);
// Different hit counts per voice by default -- otherwise every voice would
// still land on the same pulses even with the polyrhythm engine in place.
const DEFAULT_HITS = { v1:4, v2:3, v3:5, v4:2 };

let master, ready=false, playing=false;
let loopHandle=null;
let bpm=120, pulseRate=2, scanSpeed=0;
let barLength=16, pulseIndex=0;

// VOICE STATE
let voiceData = {};
VKEYS.forEach(k=>{
  voiceData[k] = {
    file: null,
    sampler: null,
    vol: null,                        // per-voice Tone.Gain, created in initAudio()
    interval: 0,                      // semitone offset from this voice's own color-note
    hue: hexHSV(VOICES[k].hex).hue,   // this voice's own pitch color
    hitsPerBar: DEFAULT_HITS[k] || 4, // polyrhythm: hits spread across the shared bar
    skipProb: 0,                      // % chance a scheduled hit is skipped
    _hitSet: null,                    // cached Set of pulse indices this voice fires on
    recState: 'off',                  // 'off' | 'recording'
    colorSeq: null,                   // recorded per-pulse hue array, one bar long, once recorded
    _recBuf: null,                    // rolling capture buffer while recording (last pass wins)
    _recTouched: false,               // did any color motion actually happen during this take
  };
});

// ============================================================
// HEX <-> HSV
// ============================================================
function hexHSV(hex){
  const r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
  let h=0;
  if(d>0){
    if(mx===r) h=((g-b)/d)%6;
    else if(mx===g) h=(b-r)/d+2;
    else h=(r-g)/d+4;
    h*=60; if(h<0)h+=360;
  }
  return { hue:h, sat: mx===0?0:d/mx, val:mx };
}

// HSV (fixed sat/val) -> hex, for drawing a drifted hue back onto a swatch/dot.
function hsvHex(h, s=0.85, v=0.95){
  const c=v*s, x=c*(1-Math.abs((h/60)%2-1)), m=v-c;
  let r,g,b;
  if(h<60){ r=c;g=x;b=0; }
  else if(h<120){ r=x;g=c;b=0; }
  else if(h<180){ r=0;g=c;b=x; }
  else if(h<240){ r=0;g=x;b=c; }
  else if(h<300){ r=x;g=0;b=c; }
  else { r=c;g=0;b=x; }
  const R=Math.round((r+m)*255), G=Math.round((g+m)*255), B=Math.round((b+m)*255);
  return '#'+[R,G,B].map(n=>n.toString(16).padStart(2,'0')).join('');
}

// ============================================================
// AUDIO INIT
// ============================================================
function initAudio(){
  master = new Tone.Gain(parseFloat($('sGain').value));
  const limiter = new Tone.Limiter(-2);
  master.connect(limiter);
  limiter.toDestination();

  // Per-voice volume: one persistent Gain node per voice, connected to
  // master. Samplers connect to their own voice's gain instead of master
  // directly, so reloading a sample never resets the fader.
  VKEYS.forEach(k=>{
    voiceData[k].vol = new Tone.Gain(1);
    voiceData[k].vol.connect(master);
  });

  ready=true;
  log('<b>Engine online.</b> Load samples, set pattern, then ENGAGE.','ok');
}

// ============================================================
// SAMPLE LOADING — direct-bytes + triple-shape decode + context-resume
// ============================================================
function withTimeout(p, ms, label){
  let t;
  const timer = new Promise((_,rej)=>{ t=setTimeout(()=>rej(new Error(label+' timed out after '+(ms/1000)+'s')), ms); });
  return Promise.race([p, timer]).finally(()=>clearTimeout(t));
}

function readFileBuffer(file){
  if (typeof file.arrayBuffer === 'function') return file.arrayBuffer();
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onload  = ()=>res(fr.result);
    fr.onerror = ()=>rej(new Error('FileReader could not read the file'));
    fr.readAsArrayBuffer(file);
  });
}

let _decodeCtx = null;
async function decodeAudio(arr, sampleRate){
  const errs = [];
  const raw = (typeof Tone !== 'undefined') ? Tone.getContext().rawContext : null;
  const ok = b => b && b.length > 0;

  if (raw && raw.decodeAudioData){
    try {
      const r = raw.decodeAudioData(arr.slice(0));
      if (r && typeof r.then === 'function'){
        const b = await r;
        if (ok(b)) return b;
        errs.push('promise: empty buffer');
      } else {
        errs.push('promise form unsupported');
      }
    } catch(e){ errs.push('promise: '+(e && e.message || e)); }

    try {
      const b = await new Promise((res,rej)=>{
        const r = raw.decodeAudioData(arr.slice(0), res, rej);
        if (r && typeof r.then === 'function') r.then(res, rej);
      });
      if (ok(b)) return b;
      errs.push('callback: empty buffer');
    } catch(e){ errs.push('callback: '+(e && e.message || e)); }
  }

  const AC = window.AudioContext || window.webkitAudioContext;
  if (AC){
    try {
      if (!_decodeCtx) _decodeCtx = new AC(sampleRate ? {sampleRate} : undefined);
      const b = await new Promise((res,rej)=>{
        const r = _decodeCtx.decodeAudioData(arr.slice(0), res, rej);
        if (r && typeof r.then === 'function') r.then(res, rej);
      });
      if (ok(b)) return b;
      errs.push('fallback ctx: empty buffer');
    } catch(e){ errs.push('fallback ctx: '+(e && e.message || e)); }
  }
  throw new Error(errs.join(' | ') || 'no decoder available');
}

async function loadSample(key, file){
  const v = voiceData[key];
  if (!file) return;
  if (typeof Tone === 'undefined'){ log('Tone.js not loaded — check connection.','wrn'); return; }

  const short = file.name.length>22 ? file.name.slice(0,21)+'…' : file.name;

  try{
    if (file.size === 0) throw new Error('file is empty (0 bytes)');
    if (file.size > 80*1024*1024) throw new Error('file is '+(file.size/1048576|0)+' MB — too big to decode on mobile');

    try{ await Tone.start(); }catch(e){ /* non-fatal */ }
    const raw = Tone.getContext().rawContext;
    if (raw && raw.state !== 'running'){ try{ await raw.resume(); }catch(e){} }

    log(`Reading ${short}…`);
    const arr = await withTimeout(readFileBuffer(file), 20000, 'read');
    if (!arr || !arr.byteLength) throw new Error('got 0 bytes back from the file');

    log(`Decoding ${short}…`);
    const audioBuffer = await withTimeout(decodeAudio(arr, raw ? raw.sampleRate : undefined), 30000, 'decode');
    if (!audioBuffer || !audioBuffer.length) throw new Error('decoded to an empty buffer');

    if (v.sampler){ try{ v.sampler.dispose(); }catch(e){} v.sampler = null; }

    const toneBuf = new Tone.ToneAudioBuffer(audioBuffer);
    let s = new Tone.Sampler({ urls:{ C4: toneBuf } });
    if (!s.loaded){ try{ s.add('C4', toneBuf); }catch(e){} }
    if (!s.loaded) throw new Error('Tone.Sampler would not accept the buffer');

    s.connect(v.vol);
    v.sampler = s;
    v.file = file.name;
    const src = $('src-'+key);
    src.textContent = file.name;
    src.classList.add('loaded');
    $('note-'+key).textContent = noteForVoice(key);
    log(`<b>${VOICES[key].label}</b> loaded: ${file.name} · ${audioBuffer.duration.toFixed(1)}s`,'ok');

  }catch(err){
    const why = (err && err.message) ? err.message : String(err);
    console.error('[loadSample:'+key+']', err);
    log(`<b>${VOICES[key].label}</b> — ${short}: ${why}`,'wrn');
  }
}

// ============================================================
// NOTE CALCULATION
// ============================================================
// Each voice's own hue is its own root; OFFSET fine-tunes from there.
// idx is the current pulse within the bar -- when a color sequence has
// been recorded, it takes over from the static swatch at that pulse,
// except while actively arming/recording (live dragging always wins then).
function noteForVoice(key, idx){
  const v = voiceData[key];
  let hue = v.hue;
  const recording = (v.recState === 'recording');
  if(idx !== undefined && !recording && v.colorSeq && v.colorSeq.length){
    const h = v.colorSeq[idx % v.colorSeq.length];
    if(h != null) hue = h;
  }
  const rootIdx = hueToNote(hue);
  const rootMidi = 60 + rootIdx;
  const voiceMidi = rootMidi + v.interval;
  return midiToName(voiceMidi);
}

// ============================================================
// PATTERN — polyrhythm hit-sets + bar visualization
// ============================================================
// Spread `hits` pulses evenly across a bar of `bar` pulses. Different
// voices with different hit counts land on different pulse indices --
// that's what actually breaks the "everyone on every pulse" unison.
function hitPulses(hits, bar){
  hits = Math.max(1, Math.min(hits, bar));
  const set = new Set();
  for(let i=0;i<hits;i++) set.add(Math.round(i*bar/hits) % bar);
  return set;
}

function rebuildPattern(){
  VKEYS.forEach(k=>{ voiceData[k]._hitSet = hitPulses(voiceData[k].hitsPerBar, barLength); });

  const el = $('barStrip');
  el.innerHTML = '';
  for(let i=0;i<barLength;i++){
    const cell = document.createElement('div');
    cell.className = 'barcell';
    cell.id = 'barcell-'+i;
    VKEYS.forEach(k=>{
      if(voiceData[k]._hitSet.has(i)){
        const dot = document.createElement('div');
        dot.className = 'bardot';
        dot.style.background = hsvHex(voiceData[k].hue);
        cell.appendChild(dot);
      }
    });
    el.appendChild(cell);
  }
}

function markPulse(idx){
  const prev = document.querySelector('.barcell.now');
  if(prev) prev.classList.remove('now');
  const cur = $('barcell-'+idx);
  if(cur) cur.classList.add('now');
}

// ============================================================
// TRIGGER / PLAYBACK
// ============================================================
function triggerPulse(idx, time){
  VKEYS.forEach(k=>{
    const v = voiceData[k];
    if(!v.sampler || !v.sampler.loaded) return;
    if(!v._hitSet || !v._hitSet.has(idx)) return;               // not this voice's pulse
    if(v.skipProb > 0 && Math.random()*100 < v.skipProb) return; // probability skip
    const note = noteForVoice(k, idx);
    try{
      v.sampler.triggerAttackRelease(note, '8n', time);
    }catch(e){
      console.error('Trigger failed:', e);
    }
  });
}

// ============================================================
// COLOR RECORDING — capture one bar of live swatch moves per voice
// ============================================================
function renderRecButton(k){
  const v = voiceData[k];
  const btn = $('rec-'+k);
  if(!btn) return;
  btn.classList.remove('recording','hasseq');
  if(v.recState === 'recording'){ btn.classList.add('recording'); btn.textContent = '\u25CF REC'; }
  else if(v.colorSeq){ btn.classList.add('hasseq'); btn.textContent = 'SEQ'; }
  else{ btn.textContent = 'REC'; }
}

// Stop a take. If the color actually moved, keep the buffer (last full bar
// of performance, since every pass overwrites); if nothing moved, discard —
// so a tap-tap "never mind" backs out clean instead of saving a flat bar.
function endRecording(k){
  const v = voiceData[k];
  if(v.recState !== 'recording') return;
  if(v._recTouched && v._recBuf){
    v.colorSeq = v._recBuf.slice();
    log(`<b>${VOICES[k].label}</b> — kept the last bar. Looping it now.`,'ok');
  }else{
    log(`<b>${VOICES[k].label}</b> — no color moves, take discarded.`,'inf');
  }
  v._recBuf = null;
  v._recTouched = false;
  v.recState = 'off';
  renderRecButton(k);
}

function toggleRecord(k){
  const v = voiceData[k];

  if(v.recState === 'recording'){ endRecording(k); return; }

  if(v.colorSeq){
    v.colorSeq = null;
    renderRecButton(k);
    log(`<b>${VOICES[k].label}</b> color sequence cleared — back to manual.`,'inf');
    return;
  }
  if(!playing){
    log('Engage the engine first, then hit REC.','wrn');
    return;
  }
  // Start immediately — no waiting for the bar line. The buffer is seeded
  // with the current hue and every pulse overwrites its own slot, so the
  // take is always the LAST bar you performed, not the first one you
  // fumbled through while opening the picker.
  v._recBuf = new Array(barLength).fill(v.hue);
  v._recTouched = false;
  v.recState = 'recording';
  renderRecButton(k);
  // Pop this voice's color picker open in the same trusted tap, so
  // REC -> perform is one motion instead of two.
  try{ $('swatch-'+k).click(); }catch(e){}
  log(`<b>${VOICES[k].label}</b> recording — ride the color. Tap \u25CF REC when the last bar sounds right.`,'inf');
}

// ============================================================
// LOOP SCHEDULING
// ============================================================
function scheduleLoop(){
  if(loopHandle !== null){
    Tone.Transport.clear(loopHandle);
    loopHandle = null;
  }
  pulseIndex = 0;
  const pulseInterval = 60 / (bpm * pulseRate);
  loopHandle = Tone.Transport.scheduleRepeat(time=>{
    const idx = pulseIndex % barLength;
    if(scanSpeed > 0){
      VKEYS.forEach(k=>{ voiceData[k].hue = (voiceData[k].hue + scanSpeed) % 360; });
    }

    // Rolling capture: every pulse overwrites its own slot with the live
    // hue, so the buffer always holds the most recent full bar performed.
    VKEYS.forEach(k=>{
      const v = voiceData[k];
      if(v.recState === 'recording' && v._recBuf){
        v._recBuf[idx] = v.hue;
        if(scanSpeed > 0) v._recTouched = true;  // scan drift is motion too
      }
    });

    triggerPulse(idx, time);
    Tone.Draw.schedule(()=>{
      markPulse(idx);
      VKEYS.forEach(k=>{
        const v = voiceData[k];
        $('note-'+k).textContent = noteForVoice(k, idx);
        // Never overwrite the swatch a user is actively dragging mid-take;
        // otherwise reflect whatever hue is actually driving this voice.
        if(v.recState !== 'recording' && (scanSpeed > 0 || (v.colorSeq && v.colorSeq.length))){
          const seqHue = (v.colorSeq && v.colorSeq.length) ? v.colorSeq[idx % v.colorSeq.length] : null;
          const hue = (seqHue != null) ? seqHue : v.hue;
          const sw = $('swatch-'+k);
          if(sw) sw.value = hsvHex(hue);
        }
      });
    }, time);
    pulseIndex++;
  }, pulseInterval);
}

// ============================================================
// MAIN LOOP
// ============================================================
async function engage(){
  if(!ready) initAudio();
  await Tone.start();
  playing=true;
  Tone.Transport.bpm.value = bpm;

  $('dot').classList.add('live');
  $('stxt').textContent = 'LIVE';
  $('btnPlay').classList.add('on');
  $('btnPlay').textContent = '■ STOP';

  scheduleLoop();
  Tone.Transport.start();
  log('Engaged · triggering voices on the clock.','ok');
}

function stop(){
  playing=false;
  if(loopHandle !== null){
    Tone.Transport.clear(loopHandle);
    loopHandle=null;
  }
  Tone.Transport.stop();
  pulseIndex = 0;
  const prevNow = document.querySelector('.barcell.now');
  if(prevNow) prevNow.classList.remove('now');
  VKEYS.forEach(k=>{
    const v = voiceData[k];
    if(v.sampler && v.sampler.triggerRelease){
      try{ v.sampler.triggerRelease(); }catch(e){}
    }
    // Stopping the engine mid-take keeps the last performed bar rather
    // than trashing it — same rule as tapping ● REC.
    if(v.recState === 'recording') endRecording(k);
  });
  $('dot').classList.remove('live');
  $('stxt').textContent = 'IDLE';
  $('btnPlay').classList.remove('on');
  $('btnPlay').textContent = '▶ ENGAGE';
  log('Stopped.','inf');
}

function log(msg, type='inf'){
  $('log').innerHTML = msg;
}

// ============================================================
// UI BUILD
// ============================================================
function buildVoiceUI(){
  const container = $('voicesContainer');
  VKEYS.forEach(k=>{
    const v = VOICES[k];
    const color = getComputedStyle(document.documentElement).getPropertyValue(v.color).trim();
    const el = document.createElement('div');
    el.className = 'voice';
    el.style.borderColor = color;
    el.innerHTML = `
      <div class="vhead">
        <input type="color" class="swatch" id="swatch-${k}" value="${v.hex}">
        <span class="vname" style="color:${color}">${v.label}</span>
        <input type="range" class="sld" id="vol-${k}" min="0" max="1" step="0.02" value="1" style="color:${color}">
        <span class="intval" id="volval-${k}" style="color:${color}">100%</span>
        <span class="vnote" id="note-${k}" style="color:${color}">${noteForVoice(k)}</span>
      </div>
      <div class="vrow">
        <button class="loadbtn" id="load-${k}">LOAD</button>
        <span class="vsrc" id="src-${k}">no sample</span>
        <button class="recbtn" id="rec-${k}" style="color:${color}">REC</button>
      </div>
      <div class="interval-ctrl">
        <label class="intlbl" style="color:${color}">OFFSET</label>
        <input type="range" class="sld" id="int-${k}" min="-24" max="24" step="1" value="0" style="color:${color}">
        <span class="intval" id="intval-${k}" style="color:${color}">+0</span>
      </div>
      <div class="interval-ctrl">
        <label class="intlbl" style="color:${color}">HITS/BAR</label>
        <input type="range" class="sld" id="hits-${k}" min="1" max="16" step="1" value="${voiceData[k].hitsPerBar}" style="color:${color}">
        <span class="intval" id="hitsval-${k}" style="color:${color}">${voiceData[k].hitsPerBar}</span>
      </div>
      <div class="interval-ctrl">
        <label class="intlbl" style="color:${color}">SKIP %</label>
        <input type="range" class="sld" id="skip-${k}" min="0" max="100" step="5" value="${voiceData[k].skipProb}" style="color:${color}">
        <span class="intval" id="skipval-${k}" style="color:${color}">${voiceData[k].skipProb}%</span>
      </div>
      <input type="file" id="file-${k}" accept="audio/*,.wav,.mp3,.m4a,.aac,.ogg,.oga,.opus,.flac,.aif,.aiff" hidden>
    `;
    container.appendChild(el);

    $('swatch-'+k).addEventListener('input', e=>{
      const {hue} = hexHSV(e.target.value);
      voiceData[k].hue = hue;
      if(voiceData[k].recState === 'recording') voiceData[k]._recTouched = true;
      $('note-'+k).textContent = noteForVoice(k);
      rebuildPattern();
    });

    $('vol-'+k).addEventListener('input', e=>{
      const val = parseFloat(e.target.value);
      $('volval-'+k).textContent = Math.round(val*100)+'%';
      if(voiceData[k].vol) voiceData[k].vol.gain.rampTo(val, 0.03);
    });

    $('rec-'+k).addEventListener('click', ()=> toggleRecord(k));

    $('load-'+k).addEventListener('click', ()=>{
      // Wake the context inside this click, not after the picker returns —
      // the tap on LOAD is the trusted gesture; the change event that
      // follows the native picker isn't guaranteed to still count as one.
      if(typeof Tone !== 'undefined'){ Tone.start().catch(()=>{}); }
      const fi = $('file-'+k);
      fi.value = '';
      fi.click();
    });
    $('file-'+k).addEventListener('change', e=>{
      const f = e.target.files && e.target.files[0];
      e.target.value = '';  // reset now too, so picking the SAME file again still fires change
      if(f) loadSample(k, f);
    });
    $('int-'+k).addEventListener('input', e=>{
      const val = parseInt(e.target.value);
      voiceData[k].interval = val;
      $('intval-'+k).textContent = (val>=0?'+':'')+val;
      $('note-'+k).textContent = noteForVoice(k);
    });
    $('hits-'+k).addEventListener('input', e=>{
      const val = parseInt(e.target.value);
      voiceData[k].hitsPerBar = val;
      $('hitsval-'+k).textContent = val;
      rebuildPattern();
    });
    $('skip-'+k).addEventListener('input', e=>{
      const val = parseInt(e.target.value);
      voiceData[k].skipProb = val;
      $('skipval-'+k).textContent = val+'%';
    });
  });
}

// ============================================================
// WINDOW LOAD
// ============================================================
window.addEventListener('load', ()=>{
  buildVoiceUI();
  rebuildPattern();

  $('sBarLen').addEventListener('input', e=>{
    barLength = parseInt(e.target.value);
    $('vBarLen').textContent = barLength;
    rebuildPattern();
  });

  $('sBPM').addEventListener('input', e=>{
    bpm = parseInt(e.target.value);
    $('vBPM').textContent = bpm;
    if(playing){
      Tone.Transport.bpm.value = bpm;
      scheduleLoop();
    }
  });

  $('sRate').addEventListener('input', e=>{
    pulseRate = parseFloat(e.target.value);
    $('vRate').textContent = pulseRate;
    if(playing) scheduleLoop();
  });

  $('sGain').addEventListener('input', e=>{
    const g = parseFloat(e.target.value);
    $('vGain').textContent = g.toFixed(2);
    if(master) master.gain.rampTo(g, 0.03);
  });

  $('sScan').addEventListener('input', e=>{
    scanSpeed = parseFloat(e.target.value);
    $('vScan').textContent = scanSpeed > 0 ? scanSpeed.toFixed(1)+' °/pulse' : 'OFF';
  });

  $('btnPlay').addEventListener('click', ()=>{
    playing ? stop() : engage();
  });

  if(typeof Tone === 'undefined'){
    log('Tone.js failed to load.','wrn');
  }else{
    initAudio();
  }
});
</script>
</body>
</html>
