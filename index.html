<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pendulum v4</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Share+Tech+Mono&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #070b12;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #header {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 10px 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: #ece5d2;
    z-index: 10;
    display: flex; justify-content: space-between; align-items: center;
    pointer-events: none; opacity: 0.5;
  }
  canvas { display: block; width: 100%; height: 100%; }
  #panel-toggle {
    position: fixed; bottom: 12px; left: 50%;
    transform: translateX(-50%); z-index: 20;
    background: #ece5d210; border: 1px solid #ece5d225;
    color: #ece5d2; font-family: 'Share Tech Mono', monospace;
    font-size: 11px; padding: 6px 20px; border-radius: 20px;
    cursor: pointer;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #panel {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 15;
    background: #0c1119ee; border-top: 1px solid #ece5d215;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transform: translateY(100%); transition: transform 0.3s ease;
    max-height: 40vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 16px 16px 60px;
  }
  #panel.open { transform: translateY(0); }
  .cg { margin-bottom: 14px; }
  .cg-t {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    color: #ece5d240; text-transform: uppercase;
    letter-spacing: 1.5px; margin-bottom: 8px;
  }
  .cr { display: flex; align-items: center; margin-bottom: 6px; gap: 10px; }
  .cl {
    font-family: 'Share Tech Mono', monospace; font-size: 11px;
    color: #ece5d2a0; min-width: 72px; flex-shrink: 0;
  }
  .cv {
    font-family: 'Share Tech Mono', monospace; font-size: 11px;
    color: #ece5d2; min-width: 42px; text-align: right; flex-shrink: 0;
  }
  input[type="range"] {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 3px; background: #ece5d220; border-radius: 2px; outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px;
    border-radius: 50%; background: #ece5d2; border: none; cursor: pointer;
  }
  .swatch {
    width: 14px; height: 14px; border-radius: 50%;
    border: 1px solid #ece5d230; flex-shrink: 0;
  }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  .btn {
    flex: 1; background: #ece5d210; border: 1px solid #ece5d220;
    color: #ece5d2a0; font-family: 'Share Tech Mono', monospace;
    font-size: 11px; padding: 8px; border-radius: 4px; cursor: pointer;
  }
  .btn:active { background: #ece5d225; }
  .node3-only { transition: opacity 0.2s; }
  .node3-only.hidden { opacity: 0.25; pointer-events: none; }
</style>
</head>
<body>
<div id="header"><span>PENDULUM — v4</span></div>
<canvas id="c"></canvas>
<button id="panel-toggle">CONTROLS</button>

<div id="panel">
  <div class="cg">
    <div class="cg-t">Mode</div>
    <div class="cr">
      <span class="cl">Nodes</span>
      <input type="range" id="sl-nodes" min="2" max="3" step="1" value="3">
      <span class="cv" id="vl-nodes">3</span>
    </div>
  </div>

  <div class="cg">
    <div class="cg-t">Physics</div>
    <div class="cr">
      <span class="cl">Gravity</span>
      <input type="range" id="sl-gravity" min="0" max="50" step="0.1" value="9.81">
      <span class="cv" id="vl-gravity">9.8</span>
    </div>
    <div class="cr">
      <span class="cl">Friction</span>
      <input type="range" id="sl-friction" min="0.990" max="1.000" step="0.0001" value="0.9997">
      <span class="cv" id="vl-friction">0.3</span>
    </div>
  </div>

  <div class="cg">
    <div class="cg-t">Rods</div>
    <div class="cr">
      <span class="cl">Rod 1</span>
      <input type="range" id="sl-L0" min="20" max="220" step="1" value="0">
      <span class="cv" id="vl-L0">—</span>
    </div>
    <div class="cr">
      <span class="cl">Rod 2</span>
      <input type="range" id="sl-L1" min="20" max="220" step="1" value="0">
      <span class="cv" id="vl-L1">—</span>
    </div>
    <div class="cr node3-only">
      <span class="cl">Rod 3</span>
      <input type="range" id="sl-L2" min="20" max="220" step="1" value="0">
      <span class="cv" id="vl-L2">—</span>
    </div>
  </div>

  <div class="cg">
    <div class="cg-t">Bobs</div>
    <div class="cr">
      <span class="cl">Mass 1</span>
      <input type="range" id="sl-m0" min="0.2" max="12" step="0.1" value="2.0">
      <span class="cv" id="vl-m0">2.0</span>
    </div>
    <div class="cr">
      <span class="cl">Mass 2</span>
      <input type="range" id="sl-m1" min="0.2" max="12" step="0.1" value="1.5">
      <span class="cv" id="vl-m1">1.5</span>
    </div>
    <div class="cr node3-only">
      <span class="cl">Mass 3</span>
      <input type="range" id="sl-m2" min="0.2" max="12" step="0.1" value="1.0">
      <span class="cv" id="vl-m2">1.0</span>
    </div>
    <div class="cr">
      <span class="cl">Size 1</span>
      <input type="range" id="sl-r0" min="1" max="30" step="1" value="1">
      <span class="cv" id="vl-r0">1</span>
    </div>
    <div class="cr">
      <span class="cl">Size 2</span>
      <input type="range" id="sl-r1" min="1" max="30" step="1" value="1">
      <span class="cv" id="vl-r1">1</span>
    </div>
    <div class="cr node3-only">
      <span class="cl">Size 3</span>
      <input type="range" id="sl-r2" min="1" max="30" step="1" value="1">
      <span class="cv" id="vl-r2">1</span>
    </div>
  </div>

  <div class="cg">
    <div class="cg-t">Trail — Last Bob</div>
    <div class="cr">
      <span class="cl">Show</span>
      <input type="range" id="sl-tA-on" min="0" max="1" step="1" value="1">
      <span class="cv" id="vl-tA-on">ON</span>
    </div>
    <div class="cr">
      <span class="cl">Hue</span>
      <input type="range" id="sl-tA-hue" min="0" max="360" step="1" value="30">
      <span class="cv" id="vl-tA-hue">30°</span>
      <div class="swatch" id="sw-tA"></div>
    </div>
  </div>

  <div class="cg">
    <div class="cg-t">Trail — Mid Bob</div>
    <div class="cr">
      <span class="cl">Show</span>
      <input type="range" id="sl-tB-on" min="0" max="1" step="1" value="1">
      <span class="cv" id="vl-tB-on">ON</span>
    </div>
    <div class="cr">
      <span class="cl">Hue</span>
      <input type="range" id="sl-tB-hue" min="0" max="360" step="1" value="220">
      <span class="cv" id="vl-tB-hue">220°</span>
      <div class="swatch" id="sw-tB"></div>
    </div>
  </div>

  <div class="cg">
    <div class="cg-t">Trail — Shared</div>
    <div class="cr">
      <span class="cl">Length</span>
      <input type="range" id="sl-tLen" min="50" max="4000" step="50" value="1200">
      <span class="cv" id="vl-tLen">1200</span>
    </div>
    <div class="cr">
      <span class="cl">Width</span>
      <input type="range" id="sl-tW" min="0.3" max="4" step="0.1" value="1.2">
      <span class="cv" id="vl-tW">1.2</span>
    </div>
    <div class="cr">
      <span class="cl">Sat</span>
      <input type="range" id="sl-tSat" min="0" max="100" step="1" value="55">
      <span class="cv" id="vl-tSat">55%</span>
    </div>
    <div class="cr">
      <span class="cl">Light</span>
      <input type="range" id="sl-tLgt" min="20" max="90" step="1" value="65">
      <span class="cv" id="vl-tLgt">65%</span>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn" id="btn-clear">CLEAR TRAILS</button>
    <button class="btn" id="btn-reset">RESET ALL</button>
  </div>
</div>

<script>
(function(){
  if(location.search.indexOf('debug')!==-1){
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/eruda';
    s.onload=()=>eruda.init();
    document.head.appendChild(s);
  }

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  let W, H, cx, cy, dpr;
  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2; cy = H * 0.22;
  }
  resize();
  window.addEventListener('resize', resize);

  const baseLen = () => Math.min(W, H) * 0.14;

  // Params
  const DEF = {
    nodes: 3,
    gravity: 9.81, friction: 0.9997,
    m: [2.0, 1.5, 1.0],
    r: [1, 1, 1],
    tAOn: 1, tAHue: 30,
    tBOn: 1, tBHue: 220,
    tLen: 1200, tW: 1.2, tSat: 55, tLgt: 65
  };

  let nodes = 3;
  let gravity = DEF.gravity, friction = DEF.friction;
  let mass = [...DEF.m], rad = [...DEF.r], rodLen = [0, 0, 0];
  let tAOn = DEF.tAOn, tAHue = DEF.tAHue;
  let tBOn = DEF.tBOn, tBHue = DEF.tBHue;
  let tLen = DEF.tLen, tW = DEF.tW, tSat = DEF.tSat, tLgt = DEF.tLgt;

  function initLengths() {
    const b = baseLen();
    rodLen = [b, b, b];
    for (let i = 0; i < 3; i++) {
      document.getElementById('sl-L' + i).value = Math.round(b);
      document.getElementById('vl-L' + i).textContent = Math.round(b);
    }
  }
  initLengths();

  // State: [θ0, ω0, θ1, ω1, θ2, ω2]
  let state = [Math.PI * 0.5, 0, Math.PI * 0.7, 0, Math.PI * 0.9, 0];

  // Dual trails
  let trailA = []; // last bob
  let trailB = []; // middle bob (bob index 1 in 3-mode, bob index 0 in... no — "mid" means second-to-last)

  // Panel
  const panelEl = document.getElementById('panel');
  const toggleBtn = document.getElementById('panel-toggle');
  let panelOpen = false;
  toggleBtn.addEventListener('click', () => {
    panelOpen = !panelOpen;
    panelEl.classList.toggle('open', panelOpen);
    toggleBtn.textContent = panelOpen ? 'CLOSE' : 'CONTROLS';
  });

  // Wire helpers
  function sl(id) { return document.getElementById('sl-' + id); }
  function vl(id) { return document.getElementById('vl-' + id); }

  function bindSlider(id, get, set, fmt) {
    const s = sl(id), v = vl(id);
    s.addEventListener('input', () => { set(parseFloat(s.value)); v.textContent = fmt(parseFloat(s.value)); updateSwatches(); });
    v.textContent = fmt(parseFloat(s.value));
  }

  // Node toggle
  const node3Els = document.querySelectorAll('.node3-only');
  function setNodeMode(n) {
    nodes = n;
    node3Els.forEach(el => el.classList.toggle('hidden', n === 2));
    trailA = []; trailB = [];
  }
  bindSlider('nodes', () => nodes, v => { setNodeMode(v); }, v => v.toFixed(0));
  setNodeMode(3);

  // Physics
  bindSlider('gravity', () => gravity, v => { gravity = v; }, v => v.toFixed(1));
  bindSlider('friction', () => friction, v => { friction = v; }, v => ((1 - v) * 1000).toFixed(1));

  // Rods
  for (let i = 0; i < 3; i++) {
    ((idx) => {
      sl('L' + idx).addEventListener('input', () => {
        rodLen[idx] = parseFloat(sl('L' + idx).value);
        vl('L' + idx).textContent = Math.round(rodLen[idx]);
      });
    })(i);
  }

  // Mass / size
  for (let i = 0; i < 3; i++) {
    ((idx) => {
      bindSlider('m' + idx, () => mass[idx], v => { mass[idx] = v; }, v => v.toFixed(1));
      bindSlider('r' + idx, () => rad[idx], v => { rad[idx] = v; }, v => v.toFixed(0));
    })(i);
  }

  // Trails
  bindSlider('tA-on', () => tAOn, v => { tAOn = v; if (v < 0.5) trailA = []; }, v => v > 0.5 ? 'ON' : 'OFF');
  bindSlider('tA-hue', () => tAHue, v => { tAHue = v; }, v => v.toFixed(0) + '°');
  bindSlider('tB-on', () => tBOn, v => { tBOn = v; if (v < 0.5) trailB = []; }, v => v > 0.5 ? 'ON' : 'OFF');
  bindSlider('tB-hue', () => tBHue, v => { tBHue = v; }, v => v.toFixed(0) + '°');
  bindSlider('tLen', () => tLen, v => { tLen = v; }, v => v.toFixed(0));
  bindSlider('tW', () => tW, v => { tW = v; }, v => v.toFixed(1));
  bindSlider('tSat', () => tSat, v => { tSat = v; }, v => v.toFixed(0) + '%');
  bindSlider('tLgt', () => tLgt, v => { tLgt = v; }, v => v.toFixed(0) + '%');

  function updateSwatches() {
    document.getElementById('sw-tA').style.background = `hsl(${tAHue},${tSat}%,${tLgt}%)`;
    document.getElementById('sw-tB').style.background = `hsl(${tBHue},${tSat}%,${tLgt}%)`;
  }
  updateSwatches();

  // Buttons
  document.getElementById('btn-clear').addEventListener('click', () => { trailA = []; trailB = []; });
  document.getElementById('btn-reset').addEventListener('click', () => {
    gravity = DEF.gravity; friction = DEF.friction;
    mass = [...DEF.m]; rad = [...DEF.r];
    tAOn = DEF.tAOn; tAHue = DEF.tAHue;
    tBOn = DEF.tBOn; tBHue = DEF.tBHue;
    tLen = DEF.tLen; tW = DEF.tW; tSat = DEF.tSat; tLgt = DEF.tLgt;
    nodes = DEF.nodes;
    initLengths();
    state = [Math.PI * 0.5, 0, Math.PI * 0.7, 0, Math.PI * 0.9, 0];
    trailA = []; trailB = [];
    setNodeMode(DEF.nodes);
    // Sync all sliders
    sl('nodes').value = nodes;
    sl('gravity').value = gravity; sl('friction').value = friction;
    for (let i = 0; i < 3; i++) {
      sl('m' + i).value = mass[i]; sl('r' + i).value = rad[i];
    }
    sl('tA-on').value = tAOn; sl('tA-hue').value = tAHue;
    sl('tB-on').value = tBOn; sl('tB-hue').value = tBHue;
    sl('tLen').value = tLen; sl('tW').value = tW;
    sl('tSat').value = tSat; sl('tLgt').value = tLgt;
    document.querySelectorAll('#panel input[type=range]').forEach(s => s.dispatchEvent(new Event('input')));
    updateSwatches();
  });

  // Prevent panel touch bleed
  panelEl.addEventListener('touchstart', e => e.stopPropagation(), { passive: false });
  panelEl.addEventListener('touchmove', e => e.stopPropagation(), { passive: false });
  toggleBtn.addEventListener('touchstart', e => e.stopPropagation(), { passive: false });

  // ---- N-pendulum solver (mass matrix) ----
  function derivs(s, n) {
    const theta = [], omega = [];
    for (let i = 0; i < n; i++) { theta.push(s[i*2]); omega.push(s[i*2+1]); }

    const tailMass = new Array(n);
    tailMass[n - 1] = mass[n - 1];
    for (let i = n - 2; i >= 0; i--) tailMass[i] = tailMass[i + 1] + mass[i];

    // Build mass matrix and force vector
    if (n === 2) {
      // 2x2 direct solve
      const c01 = Math.cos(theta[0] - theta[1]);
      const s01 = Math.sin(theta[0] - theta[1]);
      const M00 = tailMass[0] * rodLen[0] * rodLen[0];
      const M01 = tailMass[1] * rodLen[0] * rodLen[1] * c01;
      const M10 = M01;
      const M11 = tailMass[1] * rodLen[1] * rodLen[1];
      const F0 = -tailMass[1] * rodLen[0] * rodLen[1] * omega[1]*omega[1] * s01
                 - gravity * rodLen[0] * tailMass[0] * Math.sin(theta[0]);
      const F1 = tailMass[1] * rodLen[0] * rodLen[1] * omega[0]*omega[0] * Math.sin(theta[1] - theta[0])
                 - gravity * rodLen[1] * tailMass[1] * Math.sin(theta[1]);
      const det = M00 * M11 - M01 * M10;
      if (Math.abs(det) < 1e-12) return [omega[0], 0, omega[1], 0];
      const a0 = (F0 * M11 - F1 * M01) / det;
      const a1 = (M00 * F1 - M10 * F0) / det;
      return [omega[0], a0, omega[1], a1];
    }

    // 3x3
    const M = [], F = [];
    for (let i = 0; i < 3; i++) {
      M[i] = [];
      for (let j = 0; j < 3; j++) {
        const k0 = Math.max(i, j);
        M[i][j] = tailMass[k0] * rodLen[i] * rodLen[j] * Math.cos(theta[i] - theta[j]);
      }
      let fi = 0;
      for (let j = 0; j < 3; j++) {
        if (j === i) continue;
        const k0 = Math.max(i, j);
        fi -= tailMass[k0] * rodLen[i] * rodLen[j] * omega[j]*omega[j] * Math.sin(theta[i] - theta[j]);
      }
      fi -= gravity * rodLen[i] * tailMass[i] * Math.sin(theta[i]);
      F[i] = fi;
    }

    const det = M[0][0]*(M[1][1]*M[2][2]-M[1][2]*M[2][1])
              - M[0][1]*(M[1][0]*M[2][2]-M[1][2]*M[2][0])
              + M[0][2]*(M[1][0]*M[2][1]-M[1][1]*M[2][0]);
    if (Math.abs(det) < 1e-12) return [omega[0],0,omega[1],0,omega[2],0];
    const id = 1/det;
    const a0 = (F[0]*(M[1][1]*M[2][2]-M[1][2]*M[2][1]) - M[0][1]*(F[1]*M[2][2]-M[1][2]*F[2]) + M[0][2]*(F[1]*M[2][1]-M[1][1]*F[2]))*id;
    const a1 = (M[0][0]*(F[1]*M[2][2]-M[1][2]*F[2]) - F[0]*(M[1][0]*M[2][2]-M[1][2]*M[2][0]) + M[0][2]*(M[1][0]*F[2]-F[1]*M[2][0]))*id;
    const a2 = (M[0][0]*(M[1][1]*F[2]-F[1]*M[2][1]) - M[0][1]*(M[1][0]*F[2]-F[1]*M[2][0]) + F[0]*(M[1][0]*M[2][1]-M[1][1]*M[2][0]))*id;
    return [omega[0],a0,omega[1],a1,omega[2],a2];
  }

  function rk4Step(s, dt, n) {
    const len = n * 2;
    const k1 = derivs(s, n);
    const s2 = []; for (let i = 0; i < len; i++) s2[i] = s[i] + k1[i] * dt * 0.5;
    const k2 = derivs(s2, n);
    const s3 = []; for (let i = 0; i < len; i++) s3[i] = s[i] + k2[i] * dt * 0.5;
    const k3 = derivs(s3, n);
    const s4 = []; for (let i = 0; i < len; i++) s4[i] = s[i] + k3[i] * dt;
    const k4 = derivs(s4, n);
    const out = [];
    for (let i = 0; i < len; i++) out[i] = s[i] + (dt/6)*(k1[i]+2*k2[i]+2*k3[i]+k4[i]);
    return out;
  }

  function getPositions(s, n) {
    let px = cx, py = cy;
    const pos = [];
    for (let i = 0; i < n; i++) {
      px += rodLen[i] * Math.sin(s[i*2]);
      py += rodLen[i] * Math.cos(s[i*2]);
      pos.push({ x: px, y: py });
    }
    return pos;
  }

  // Dragging
  let dragging = null, dragHistory = [];
  function pointerPos(e) {
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function hitTest(px, py, n) {
    const pos = getPositions(state, n);
    for (let i = n - 1; i >= 0; i--) {
      if (Math.hypot(px - pos[i].x, py - pos[i].y) < 40) return i;
    }
    return null;
  }
  function onDown(e) {
    if (panelOpen) return;
    e.preventDefault();
    const p = pointerPos(e);
    const hit = hitTest(p.x, p.y, nodes);
    if (hit !== null) {
      dragging = hit;
      dragHistory = [{ x: p.x, y: p.y, t: performance.now() }];
    }
  }
  function onMove(e) {
    if (dragging === null) return;
    e.preventDefault();
    const p = pointerPos(e);
    dragHistory.push({ x: p.x, y: p.y, t: performance.now() });
    if (dragHistory.length > 6) dragHistory.shift();
    // Pivot for this bob
    let pivX = cx, pivY = cy;
    for (let i = 0; i < dragging; i++) {
      pivX += rodLen[i] * Math.sin(state[i*2]);
      pivY += rodLen[i] * Math.cos(state[i*2]);
    }
    state[dragging*2] = Math.atan2(p.x - pivX, p.y - pivY);
    state[dragging*2+1] = 0;
    for (let i = dragging+1; i < 3; i++) state[i*2+1] = 0;
  }
  function onUp(e) {
    if (dragging === null) return;
    e.preventDefault();
    if (dragHistory.length >= 2) {
      const last = dragHistory[dragHistory.length - 1];
      const prev = dragHistory[Math.max(0, dragHistory.length - 3)];
      const dt = (last.t - prev.t) / 1000;
      if (dt > 0.001 && dt < 0.3) {
        const vx = (last.x - prev.x) / dt;
        const vy = (last.y - prev.y) / dt;
        const a = state[dragging*2];
        state[dragging*2+1] = (vx * Math.cos(a) - vy * Math.sin(a)) / rodLen[dragging];
      }
    }
    dragging = null; dragHistory = [];
  }
  canvas.addEventListener('touchstart', onDown, { passive: false });
  canvas.addEventListener('touchmove', onMove, { passive: false });
  canvas.addEventListener('touchend', onUp, { passive: false });
  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mouseup', onUp);

  // Render
  const dtPhys = 1/120;
  let acc = 0, lastT = performance.now();

  function drawTrail(arr, hue) {
    if (arr.length < 2) return;
    for (let i = 1; i < arr.length; i++) {
      const alpha = (i / arr.length) * 0.65;
      ctx.beginPath();
      ctx.moveTo(arr[i-1].x, arr[i-1].y);
      ctx.lineTo(arr[i].x, arr[i].y);
      ctx.strokeStyle = `hsla(${hue},${tSat}%,${tLgt}%,${alpha})`;
      ctx.lineWidth = tW;
      ctx.stroke();
    }
  }

  function frame(now) {
    requestAnimationFrame(frame);
    let el = (now - lastT) / 1000;
    lastT = now;
    if (el > 0.1) el = 0.1;
    acc += el;

    const n = nodes;
    while (acc >= dtPhys) {
      if (dragging === null) {
        const stepped = rk4Step(state, dtPhys, n);
        for (let i = 0; i < n*2; i++) state[i] = stepped[i];
        for (let i = 0; i < n; i++) state[i*2+1] *= friction;
      }
      acc -= dtPhys;
    }

    const pos = getPositions(state, n);

    // Record trails
    // Trail A = last bob, Trail B = second-to-last (mid bob)
    const lastIdx = n - 1;
    const midIdx = n >= 2 ? n - 2 : -1;

    if (tAOn > 0.5) {
      trailA.push({ x: pos[lastIdx].x, y: pos[lastIdx].y });
      while (trailA.length > tLen) trailA.shift();
    }
    if (tBOn > 0.5 && midIdx >= 0) {
      trailB.push({ x: pos[midIdx].x, y: pos[midIdx].y });
      while (trailB.length > tLen) trailB.shift();
    }

    ctx.clearRect(0, 0, W, H);

    // Draw trails
    if (tBOn > 0.5) drawTrail(trailB, tBHue);
    if (tAOn > 0.5) drawTrail(trailA, tAHue);

    // Pivot
    ctx.beginPath();
    ctx.arc(cx, cy, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#ece5d2';
    ctx.fill();

    // Rods + bobs
    let prevX = cx, prevY = cy;
    for (let i = 0; i < n; i++) {
      ctx.beginPath();
      ctx.moveTo(prevX, prevY);
      ctx.lineTo(pos[i].x, pos[i].y);
      ctx.strokeStyle = '#ece5d250';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(pos[i].x, pos[i].y, rad[i], 0, Math.PI * 2);
      ctx.fillStyle = dragging === i ? '#fff' : '#ece5d2';
      ctx.fill();

      prevX = pos[i].x; prevY = pos[i].y;
    }
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
